<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAM • Tasks</title>
  <style>
    :root{
      --brand:#9b1c1c; --brand-d:#7c1111; --gold:#fbbf24;
      --rose25:#fbeceb; --rose50:#f6d8d5; --rose75:#f2c4bf;
      --ink:#161617; --muted:#6b7280;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    body{
      margin:0;color:var(--ink);
      background:
        radial-gradient(120% 120% at -10% -10%, var(--rose25) 0%, transparent 60%),
        radial-gradient(120% 120% at 110% -10%, var(--rose50) 0%, transparent 60%),
        linear-gradient(180deg,#fff 0%,var(--rose25) 30%,var(--rose50) 85%,var(--rose75) 100%);
    }
    header{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:14px 16px;font-weight:800;letter-spacing:.3px}
    .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 96px}
    .card{background:rgba(255,255,255,.9);border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.06);padding:12px;margin:12px 0}
    .title{font-weight:800;margin:6px 2px 10px}
    .media{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
    .media iframe,.media video{width:100%;height:100%;display:block}
    .desc{margin-top:10px;font-size:14px;color:#3a2e2e}
    .controls{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .btn{appearance:none;border:none;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}
    .btn.primary{background:var(--gold);color:#111}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .earn{font-size:12px;font-weight:800;color:#0b5d2c;background:#e8fff2;border:1px solid #c3efda;border-radius:999px;padding:6px 10px}
    .muted{color:var(--muted);font-size:12px}
    .banner{background:#fff3f3;border:1px solid #f6caca;color:#7c1111;padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
    .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
    .nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
      display:flex;justify-content:space-around;padding:10px 8px 12px;z-index:10;backdrop-filter:blur(4px);
      box-shadow:0 -6px 20px rgba(0,0,0,.06)}
    .nav a{flex:1;text-align:center;text-decoration:none;color:#6b4a4a;font-size:12px;padding:6px 0;border-radius:16px;margin:0 4px;transition:.15s}
    .nav a.active{color:#fff;background:var(--brand);box-shadow:0 6px 16px rgba(155,28,28,.25);font-weight:800}
    .nav .n-ico{display:block;font-size:20px;margin-bottom:4px}
    .overlay{position:fixed;inset:0;background:rgba(255,255,255,.96);display:grid;place-items:center;z-index:9999}
    .overlay .box{text-align:center;color:#7c1111;font-weight:700;background:#fff;border:1px solid #f6caca;border-radius:14px;
      padding:16px 18px;box-shadow:0 10px 24px rgba(0,0,0,.08)}
    
  </style>
</head>
<body>
  <header>BAM Tasks</header>


  <body style="background:#fff; margin:0; padding:0;">


  <main class="wrap">
    <div id="statusArea"></div>
    <div id="adList"></div>
  </main>

  <nav class="nav">
    <a href="index.html"><span class="n-ico">🏠</span>Home</a>
    <a class="active" href="tasks.html" aria-current="page"><span class="n-ico">🗂️</span>Tasks</a>
    <a href="levels.html"><span class="n-ico">🎖️</span>Levels</a>
    <a href="profit.html"><span class="n-ico">💹</span>Profit</a>
    <a href="account.html"><span class="n-ico">👤</span>Account</a>
  </nav>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc, setDoc,
      serverTimestamp, where, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    /* ---------- Firebase ---------- */
    const firebaseConfig = {
      apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
      authDomain: "bam1-3d3e5.firebaseapp.com",
      projectId: "bam1-3d3e5",
      storageBucket: "bam1-3d3e5.firebasestorage.app",
      messagingSenderId: "649603741902",
      appId: "1:649603741902:web:e67f20363f485c0948789f",
      measurementId: "G-W2DY026FXB"
    };
    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ---------- Helpers & Config ---------- */
    const $ = (id)=>document.getElementById(id);
    const hideOverlay = ()=>{ const el = document.getElementById('pageLoading'); if(el) el.style.display='none'; };
    const todayKey = ()=> new Date().toISOString().slice(0,10);
    const shuffle = (arr)=>{ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };

    // Payouts & daily caps
    const LEVEL_RATES = {
      INTERN: { perTask: 300,  dailyMax: 5  },
      B1:     { perTask: 330,  dailyMax: 7  },
      B2:     { perTask: 430,  dailyMax: 17 },
      B3:     { perTask: 735,  dailyMax: 28 },
      B4:     { perTask: 1200, dailyMax: 54 },
      B5:     { perTask: 2250, dailyMax: 80 },
      B6:     { perTask: 3700,  dailyMax: 130 },
      B7:     { perTask: 6500,  dailyMax: 175 },
      B8:     { perTask: 8750,  dailyMax: 260 },
      B9:     { perTask: 15000,dailyMax: 300 },
    };

    const INTERNSHIP_DAYS = 3;
    const levelsDesc = ["B9","B8","B7","B6","B5","B4","B3","B2","B1"]; // highest first

    function showBanner(html, ok=false){
      const node = document.createElement("div");
      node.className = "banner" + (ok ? " ok": "");
      node.innerHTML = html;
      const area = $("statusArea"); area.innerHTML = ""; area.appendChild(node);
    }

    // internship data
    function tsToDate(v){ if (!v) return null; if (v.toDate) return v.toDate(); const d = new Date(v); return isNaN(d)?null:d; }
    async function ensureInternshipStart(uid){
      const tRef = doc(db,"tasks",uid);
      const tSnap = await getDoc(tRef);
      if (!tSnap.exists() || !tSnap.data().internshipStart){
        await setDoc(tRef,{ internshipStart: serverTimestamp(), createdAt: serverTimestamp() },{ merge:true });
        return new Date();
      }
      return tsToDate(tSnap.data().internshipStart) || new Date();
    }
    const daysBetween = (a,b)=> Math.floor((b-a)/(24*3600*1000));
    async function getInternshipInfo(uid){
      const start = await ensureInternshipStart(uid);
      const elapsed = daysBetween(start, new Date());
      return { elapsed, left: Math.max(0, INTERNSHIP_DAYS - elapsed), ended: elapsed >= INTERNSHIP_DAYS };
    }

    // levels
    function highestLevelWithStatus(userDoc, status){
      for (const code of levelsDesc){
        const entry = userDoc?.[code];
        if (entry && entry.status === status) return code;
      }
      return null;
    }

    // ==== EVENTS HELPERS (no composite index needed) ====
    async function getTodayEvents(uid){
      const evCol = collection(db,"tasks",uid,"events");
      const qy = query(evCol, where("dateKey","==", todayKey()));
      const snap = await getDocs(qy);
      const events = [];
      snap.forEach(d => events.push({ id:d.id, ...d.data() }));
      return events;
    }
    async function countToday(uid){
      const events = await getTodayEvents(uid);
      return events.length;
    }
    async function alreadyDoneToday(uid, adId){
      const events = await getTodayEvents(uid);
      return events.some(e => String(e.adId) === String(adId));
    }

    /* ---------- YouTube helpers ---------- */
    const pendingYT = []; let ytReady = false;
    window.onYouTubeIframeAPIReady = ()=>{ ytReady = true; for (const p of pendingYT){ p.attach(); } pendingYT.length = 0; };
    function extractYouTubeId(input){
      if (!input) return "";
      const s = String(input);
      let m = s.match(/[?&]v=([A-Za-z0-9_-]{11})/); if (m) return m[1];
      m = s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/); if (m) return m[1];
      m = s.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{11})/); if (m) return m[1];
      m = s.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/); if (m) return m[1];
      m = s.match(/^([A-Za-z0-9_-]{11})$/); if (m) return m[1];
      return "";
    }
    function youTubeEmbedSrc(ad){
      const id = ad.videoId || extractYouTubeId(ad.url || "");
      if (!id) return "";
      const origin = encodeURIComponent(location.origin);
      return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=${origin}`;
    }

    /* ---------- Rendering ---------- */
    let MODE = "INTERN"; // "INTERN" | "LEVEL" | "BLOCKED"
    let ACTIVE_LEVEL = "INTERN";

    async function loadAdvertsAndRender(levelCfg, uid){
      const list = $("adList");
      const snap = await getDocs(query(collection(db,"adverts"), orderBy("createdAt","desc"), limit(20)));
      if (snap.empty) { list.innerHTML = '<div class="banner">No adverts available yet.</div>'; hideOverlay(); return; }

      // collect and shuffle
      const items = [];
      snap.forEach(d=> items.push({ id:d.id, ...d.data() }));
      shuffle(items);

      list.innerHTML = "";
      // render sequentially so we can await the “already claimed?” check
      for (const ad of items){
        // eslint-disable-next-line no-await-in-loop
        await renderAdCard(list, ad, levelCfg, uid);
      }
      hideOverlay();
    }

    async function renderAdCard(container, ad, levelCfg, uid){
      const card = document.createElement("section");
      card.className = "card";

      const iframeId = `yt_${ad.id}`;
      const mediaId  = `media_${ad.id}`;
      const btnId    = `btn_${ad.id}`;

      const state = { started:false, timer:null, processing:false };
      let ytPlayer = null, videoEl = null;

      const earnAmount = Number(levelCfg.perTask || 0);
      const earnStr = `UGX ${earnAmount.toLocaleString("en-UG")}`;

      const isYT = ad.sourceType === "youtube";
      const ytSrc = isYT ? youTubeEmbedSrc(ad) : "";
      const mediaHtml = isYT
        ? `<iframe id="${iframeId}" src="${ytSrc}" frameborder="0"
             allow="autoplay; encrypted-media; picture-in-picture; clipboard-write; accelerometer"
             allowfullscreen></iframe>`
        : `<video src="${ad.url}" muted playsinline autoplay controls></video>`;

      card.innerHTML = `
        <div class="title">${ad.title || "Watch this advert"}</div>
        <div class="media" id="${mediaId}">${mediaHtml}</div>
        <div class="desc">${ad.description ? ad.description : ""}</div>
        <div class="controls">
          <span class="earn">Earn ${earnStr}</span>
          <button class="btn primary" id="${btnId}">${
            MODE==="BLOCKED" ? "Waiting to get verified" : "Claim (10s)"
          }</button>
        </div>
      `;
      container.appendChild(card);

      const btn = card.querySelector(`#${btnId}`);
      const mediaWrap = card.querySelector(`#${mediaId}`);

      // Disable if blocked (under_review & internship finished)
      if (MODE === "BLOCKED"){ btn.disabled = true; }

      if (isYT && ytSrc){
        const attach = ()=>{
          if (window.YT && window.YT.Player){
            ytPlayer = new window.YT.Player(iframeId, { events: { onStateChange: ()=>{} } });
          }
        };
        if (ytReady) attach(); else pendingYT.push({ attach });
      } else if (!isYT) {
        videoEl = mediaWrap.querySelector("video");
      } else {
        mediaWrap.innerHTML = `<div class="banner">Invalid YouTube link for this advert.</div>`;
      }

      // On render: mark button as Already claimed if user did this ad today
      try{
        const claimed = await alreadyDoneToday(uid, ad.id);
        if (claimed){
          btn.textContent = "Already claimed";
          btn.disabled = true;
        }
      }catch{ /* ignore */ }

      function startCountdown(){
        state.started = true;
        const start = Date.now();
        btn.disabled = true;
        const tick = ()=>{
          const elapsed = Math.floor((Date.now() - start)/1000);
          if (elapsed >= 10){ clearInterval(state.timer); state.timer=null; btn.textContent = "Claim Reward"; btn.disabled = false; }
          else { btn.textContent = `Claim (${10 - elapsed}s)`; }
        };
        state.timer = setInterval(tick, 300);
      }

      btn.addEventListener("click", async ()=>{
        if (MODE === "BLOCKED") return;

        if (!state.started){
          try{
            if (isYT && ytPlayer){ ytPlayer.unMute?.(); ytPlayer.playVideo?.(); }
            else if (videoEl){ videoEl.muted=false; await videoEl.play().catch(()=>{}); }
          }catch{}
          startCountdown();
          return;
        }

        if (state.processing || btn.disabled || state.timer) return;
        state.processing = true; btn.disabled = true; btn.textContent = "Processing…";

        try{
          const user = auth.currentUser; if (!user) throw new Error("Please sign in again.");

          // Level used for payout
          const levelUsed = MODE === "LEVEL" ? ACTIVE_LEVEL : "INTERN";
          const cfg = LEVEL_RATES[levelUsed];

          // Safety checks
          const done = await countToday(user.uid);
          if (done >= cfg.dailyMax){
            showBanner(`Daily task limit reached (${cfg.dailyMax}). Come back tomorrow!`);
            btn.textContent = "Limit reached"; return;
          }
          if (await alreadyDoneToday(user.uid, ad.id)){
            btn.textContent = "Already claimed";
            btn.disabled = true;
            showBanner("You already completed this advert today.");
            return;
          }

          // *** FIXED TRANSACTION: read all docs first, then write ***
          await runTransaction(db, async (tx)=>{
            const uref   = doc(db,"users",user.uid);
            const evRef  = doc(collection(db,"tasks",user.uid,"events"));
            const dateK  = todayKey();

            // Prepare day marker refs (read BEFORE any write)
            let markRef = null, markSnap = null;
            if (levelUsed !== "INTERN") {
              markRef = doc(collection(db,"tasks",user.uid,"dayMarkers"), `${dateK}_${levelUsed}`);
              markSnap = await tx.get(markRef);
            }

            // Read user doc (BEFORE any write)
            const usnap = await tx.get(uref);
            const u = usnap.exists() ? usnap.data() : {};

            // Compute updates
            const nextCommission = Number(u.commissionWallet || 0) + Number(cfg.perTask);
            const userUpdate = { commissionWallet: nextCommission };

            if (levelUsed !== "INTERN" && !markSnap) {
              // (safety) but markSnap is always set if not INTERN
            }
            if (levelUsed !== "INTERN" && markSnap && !markSnap.exists()) {
              const currentLevelMap = (u[levelUsed] || {});
              const currentDaysLeft = typeof currentLevelMap.daysLeft === "number" ? currentLevelMap.daysLeft : 100;
              const newDaysLeft = Math.max(0, currentDaysLeft - 1);
              const nextLevelMap = { ...currentLevelMap, daysLeft: newDaysLeft };
              if (newDaysLeft === 0) nextLevelMap.status = "completed 100 days";
              userUpdate[levelUsed] = nextLevelMap;
            }

            // Now perform WRITES
            tx.set(uref, userUpdate, { merge:true });

            tx.set(evRef, {
              adId: ad.id,
              amount: cfg.perTask,
              dateKey: dateK,
              createdAt: serverTimestamp(),
              sourceType: ad.sourceType || null,
              url: ad.url || null,
              title: ad.title || null,
              levelUsed
            });

            if (levelUsed !== "INTERN" && markSnap && !markSnap.exists()) {
              tx.set(markRef, { level: levelUsed, dateKey: dateK, createdAt: serverTimestamp() });
            }
          });

          // UI feedback
          showBanner(`Great! +UGX ${Number(cfg.perTask).toLocaleString("en-UG")} added to your commission wallet.`, true);
          btn.textContent = "Already claimed";
          btn.disabled = true;
        }catch(e){
          console.error(e);
          btn.textContent = "Try again";
          btn.disabled = false;
          showBanner(e?.message || "Failed to claim reward.");
        }finally{
          state.processing = false;
        }
      });
    }

    /* ---------- Main flow ---------- */
    onAuthStateChanged(auth, async (user)=>{
      if (!user){ location.href = "login.html"; return; }

      try{
        const uRef = doc(db,"users",user.uid);
        const uSnap = await getDoc(uRef);
        const u = uSnap.exists() ? uSnap.data() : {};

        const verifiedLevel = highestLevelWithStatus(u, "verified");
        const underReviewLevel = highestLevelWithStatus(u, "under_review");

        if (verifiedLevel){
          MODE = "LEVEL";
          ACTIVE_LEVEL = verifiedLevel;
          const cfg = LEVEL_RATES[verifiedLevel];
          showBanner(`Status: <b>Verified (${verifiedLevel})</b>. You earn <b>UGX ${cfg.perTask.toLocaleString("en-UG")}</b> per task, up to <b>${cfg.dailyMax}</b> tasks daily.`, true);
          await loadAdvertsAndRender(cfg, user.uid);
          return;
        }

        const { left, ended } = await getInternshipInfo(user.uid);

        if (underReviewLevel){
          if (ended){
            MODE = "BLOCKED";
            ACTIVE_LEVEL = "INTERN";
            showBanner(`Your internship finished. Upgrade to <b>${underReviewLevel}</b> is pending verification. <b>Waiting to get verified</b>. Please check again later or <b>contact manager</b> for faster verification.`);
            await loadAdvertsAndRender(LEVEL_RATES.INTERN, user.uid);
            return;
          } else {
            MODE = "INTERN";
            ACTIVE_LEVEL = "INTERN";
            const dayWord = left === 1 ? "day" : "days";
            showBanner(`Upgrade to <b>${underReviewLevel}</b> is under review. Meanwhile, continue with your internship — <b>${left} ${dayWord} left</b>.`);
            await loadAdvertsAndRender(LEVEL_RATES.INTERN, user.uid);
            return;
          }
        }

        // No level yet
        MODE = "INTERN";
        ACTIVE_LEVEL = "INTERN";
        if (ended){
          showBanner(`Your 3-day internship has ended. <b>Recharge</b> to unlock withdrawals and join a paid level for higher daily tasks.`);
        } else {
          const dayWord = left === 1 ? "day" : "days";
          showBanner(`Internship in progress — <b>${left} ${dayWord} left</b>. You can earn UGX 300 per task (5 tasks/day).`);
        }
        await loadAdvertsAndRender(LEVEL_RATES.INTERN, user.uid);
      } finally {
        hideOverlay();
      }
    });
  </script>
</body>
</html>
