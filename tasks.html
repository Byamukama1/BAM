<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAM • Tasks</title>
  <style>
    :root {
      --brand:#9b1c1c; --brand-d:#7c1111; --gold:#fbbf24;
      --ink:#161617; --muted:#6b7280;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    body{margin:0;color:var(--ink);background:#fff;}
    header{
      background:linear-gradient(135deg,var(--brand),var(--brand-d));
      color:#fff;padding:14px 16px;font-weight:800;letter-spacing:.3px;
    }
    .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 96px}
    .card{
      background:#fff;border-radius:16px;
      box-shadow:0 6px 14px rgba(0,0,0,.06);
      padding:12px;margin:12px 0;
    }
    .title{font-weight:800;margin:6px 2px 10px}
    .media{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
    iframe,video{width:100%;height:100%;display:block;border:none;}
    .desc{margin-top:10px;font-size:14px;color:#3a2e2e}
    .controls{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .btn{appearance:none;border:none;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}
    .btn.primary{background:var(--gold);color:#111}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .earn{font-size:12px;font-weight:800;color:#0b5d2c;background:#e8fff2;
      border:1px solid #c3efda;border-radius:999px;padding:6px 10px}
    .banner{background:#fff3f3;border:1px solid #f6caca;color:#7c1111;
      padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
    .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
    .nav{
      position:fixed;left:0;right:0;bottom:0;background:#fff;
      display:flex;justify-content:space-around;padding:10px 8px 12px;
      z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.06)
    }
    .nav a{flex:1;text-align:center;text-decoration:none;color:#6b4a4a;font-size:12px;padding:6px 0;border-radius:16px;margin:0 4px;transition:.15s}
    .nav a.active{color:#fff;background:var(--brand);box-shadow:0 6px 16px rgba(155,28,28,.25);font-weight:800}
    .nav .n-ico{display:block;font-size:20px;margin-bottom:4px}
  </style>
</head>
<body>
  <header>BAM Tasks</header>

  <main class="wrap">
    <div id="statusArea"></div>
    <div id="adList"></div>
  </main>

  <nav class="nav">
    <a href="index.html"><span class="n-ico">🏠</span>Home</a>
    <a class="active" href="tasks.html" aria-current="page"><span class="n-ico">🗂️</span>Tasks</a>
    <a href="levels.html"><span class="n-ico">🎖️</span>Levels</a>
    <a href="profit.html"><span class="n-ico">💹</span>Profit</a>
    <a href="account.html"><span class="n-ico">👤</span>Account</a>
  </nav>
  
  


<script type="module">  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";  
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";  
  import {  
    getFirestore, collection, query, orderBy, getDocs,  
    doc, getDoc, runTransaction, where, serverTimestamp  
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";  
  
  const firebaseConfig = {  
    apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",  
    authDomain: "bam1-3d3e5.firebaseapp.com",  
    projectId: "bam1-3d3e5",  
    storageBucket: "bam1-3d3e5.firebasestorage.app",  
    messagingSenderId: "649603741902",  
    appId: "1:649603741902:web:e67f20363f485c0948789f",  
  };  
  
  const app = initializeApp(firebaseConfig);  
  const auth = getAuth(app);  
  const db = getFirestore(app);  
  
  const $ = (id)=>document.getElementById(id);  
  const todayKey = ()=> new Date().toISOString().slice(0,10);  
  const shuffle = (arr)=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}  
  
  /* ---- Currency ---- */  
  const symbols = { UGX:"UGX", NGN:"₦", TZS:"TSh", KES:"KSh", GHS:"₵", ZMW:"ZK" };  
  const rates   = { UGX:1, NGN:0.25, TZS:0.62, KES:0.036, GHS:0.0015, ZMW:0.005 };  
  let userCurrency = "UGX";  
  const fmt = (n)=>`${symbols[userCurrency]||"UGX"} ${parseFloat(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;  
  
  async function getUserCurrency(uid){  
    try{  
      const ref = doc(db,"countries",uid);  
      const snap = await getDoc(ref);  
      return snap.exists()? (snap.data().country || "UGX") : "UGX";  
    }catch{return "UGX";}  
  }  
  
  /* ---- Levels ---- */  
  const LEVEL_RATES = {  
    INTERN:{perTask:300,dailyMax:5},  
    B1:{perTask:250,dailyMax:4}, B2:{perTask:330,dailyMax:7}, B3:{perTask:430,dailyMax:17},  
    B4:{perTask:735,dailyMax:28}, B5:{perTask:1200,dailyMax:54},  
    B6:{perTask:2250,dailyMax:80}, B7:{perTask:3700,dailyMax:130},  
    B8:{perTask:6500,dailyMax:175}, B9:{perTask:8750,dailyMax:260}, B10:{perTask:15000,dailyMax:300}  
  };  
  const levelsDesc=["B10","B9","B8","B7","B6","B5","B4","B3","B2","B1"];  
  
  function showBanner(html,ok=false){  
    const node=document.createElement("div");  
    node.className="banner"+(ok?" ok":"");  
    node.innerHTML=html;  
    const area=$("statusArea"); area.innerHTML=""; area.appendChild(node);  
  }  
  
  function highestLevelWithStatus(userDoc,status){  
    for(const code of levelsDesc){  
      const entry=userDoc?.[code];  
      if(entry && entry.status===status) return code;  
    }  
    return null;  
  }  
  
  async function getTodayEvents(uid){  
    const evCol=collection(db,"tasks",uid,"events");  
    const qy=query(evCol,where("dateKey","==",todayKey()));  
    const snap=await getDocs(qy);  
    const ev=[]; snap.forEach(d=>ev.push({id:d.id,...d.data()})); return ev;  
  }  
  
  async function countToday(uid){return (await getTodayEvents(uid)).length;}  
  async function alreadyDoneToday(uid,adId){  
    const ev=await getTodayEvents(uid);  
    return ev.some(e=>String(e.adId)===String(adId));  
  }  
  
  /* ---- Render Each Ad ---- */  
  async function renderAdCard(container,ad,levelCfg,uid){  
    const card=document.createElement("section");  
    card.className="card";  
    const btnId=`btn_${ad.id}`;  

    // ✅ Two decimal currency calculation
    const earnAmount = (levelCfg.perTask * (rates[userCurrency] || 1)).toFixed(2);
    const earnStr = fmt(earnAmount);
  
    // ✅ YouTube or uploaded video  
    let mediaHTML="";  
    let ytIframe=null, videoEl=null;  
  
    if(ad.url?.includes("youtube.com") || ad.url?.includes("youtu.be")){  
      const videoId = ad.url.split("v=")[1]?.split("&")[0] || ad.url.split("/").pop();  
      mediaHTML = `<iframe id="yt_${ad.id}" src="https://www.youtube.com/embed/${videoId}?enablejsapi=1&mute=1&autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;  
    }else{  
      mediaHTML = `<video id="vid_${ad.id}" src="${ad.url}" muted playsinline autoplay controls></video>`;  
    }  
  
    card.innerHTML=`  
      <div class="title">${ad.title||"Watch this advert"}</div>  
      <div class="media">${mediaHTML}</div>  
      <div class="desc">${ad.description||""}</div>  
      <div class="controls">  
        <span class="earn">Earn ${earnStr}</span>  
        <button class="btn primary" id="${btnId}">Claim (10s)</button>  
      </div>`;  
    container.appendChild(card);  
  
    const btn = card.querySelector(`#${btnId}`);  
    videoEl=card.querySelector("video");  
    ytIframe=card.querySelector("iframe");  
  
    if(await alreadyDoneToday(uid,ad.id)){btn.textContent="Already claimed";btn.disabled=true;return;}  
  
    let started=false, finished=false, timer=null;  
  
    function startCountdown(){  
      started=true; const start=Date.now(); btn.disabled=true;  
      timer=setInterval(()=>{  
        const elapsed=Math.floor((Date.now()-start)/1000);  
        if(elapsed>=10){clearInterval(timer);btn.textContent="Claim Reward";btn.disabled=false;finished=true;}  
        else btn.textContent=`Claim (${10-elapsed}s)`;  
      },300);  
    }  
  
    btn.addEventListener("click", async()=>{  
      // STEP 1: Unmute and play on first click  
      if(!started){  
        if(videoEl){  
          videoEl.muted=false;  
          videoEl.play().catch(()=>{});  
        } else if(ytIframe){  
          ytIframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');  
          ytIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');  
        }  
        startCountdown();  
        return;  
      }  
  
      // STEP 2: After countdown → process reward  
      if(!finished || btn.disabled) return;  
      btn.disabled=true; btn.textContent="Processing…";  
  
      try{  
        const user=auth.currentUser; if(!user) throw new Error("Please sign in again.");  
        const done=await countToday(user.uid);  
        if(done>=levelCfg.dailyMax){  
          showBanner(`Daily task limit reached (${levelCfg.dailyMax}). Come back tomorrow!`);  
          btn.textContent="Limit reached"; return;  
        }  
        if(await alreadyDoneToday(user.uid,ad.id)){  
          btn.textContent="Already claimed"; btn.disabled=true;  
          showBanner("You already completed this advert today."); return;  
        }  
  
        const actualReward=parseFloat(earnAmount);  
        await runTransaction(db, async(tx)=>{  
          const uref=doc(db,"users",user.uid);  
          const evRef=doc(collection(db,"tasks",user.uid,"events"));  
          const usnap=await tx.get(uref);  
          const u=usnap.exists()?usnap.data():{};  
          tx.set(uref,{  
            commissionWallet:(u.commissionWallet||0)+actualReward,  
            todayIncome:(u.todayIncome||0)+actualReward,  
            totalIncome:(u.totalIncome||0)+actualReward,  
            weekIncome:(u.weekIncome||0)+actualReward,  
            monthIncome:(u.monthIncome||0)+actualReward  
          },{merge:true});  
          tx.set(evRef,{  
            adId:ad.id,amount:actualReward,dateKey:todayKey(),  
            createdAt:serverTimestamp(),country:userCurrency  
          });  
        });  
  
        showBanner(`Great! +${fmt(actualReward)} added to your commission wallet.`,true);  
        btn.textContent="Already claimed";btn.disabled=true;  
      }catch(e){  
        console.error(e);  
        btn.textContent="Try again";  
        btn.disabled=false;  
        showBanner(e?.message || "Failed to claim reward.");  
      }  
    });  
  }  
  
  async function loadAdvertsAndRender(cfg,uid){  
    const list=$("adList");  
    const snap=await getDocs(query(collection(db,"adverts"),orderBy("createdAt","desc")));  
    if(snap.empty){  
      list.innerHTML='<div class="banner">No adverts available yet.</div>';return;  
    }  
    const ads=[];snap.forEach(d=>ads.push({id:d.id,...d.data()}));  
    shuffle(ads);  
    list.innerHTML="";  
    for(const ad of ads.slice(0,cfg.dailyMax)){await renderAdCard(list,ad,cfg,uid);}  
  }  
  
  onAuthStateChanged(auth, async(user)=>{  
    if(!user){location.href="login.html";return;}  
    userCurrency=await getUserCurrency(user.uid);  
    const uRef=doc(db,"users",user.uid);  
    const uSnap=await getDoc(uRef);  
    const u=uSnap.exists()?uSnap.data():{};  
    const verified=highestLevelWithStatus(u,"verified");  
    const cfg=verified?LEVEL_RATES[verified]:LEVEL_RATES.INTERN;  
    const rewardPerTask=(cfg.perTask*(rates[userCurrency]||1)).toFixed(2);  
    const rateText=fmt(rewardPerTask);  
  
    if(verified){  
      showBanner(`Status: <b>Verified (${verified})</b>. You earn <b>${rateText}</b> per task, up to <b>${cfg.dailyMax}</b> tasks daily.`,true);  
    }else{  
      showBanner(`Internship mode. You earn <b>${rateText}</b> per task.`,true);  
    }  
    await loadAdvertsAndRender(cfg,user.uid);  
  });  
</script>
</body>
</html>
