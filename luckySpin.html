<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAM • Lucky Spin</title>
  <style>
    :root{
      --brand:#9b1c1c; --brand-d:#7c1111; --gold:#fbbf24;
      --ink:#161617; --muted:#6b7280; --ok:#065f46; --okbg:#ecfdf5;
      --warn:#7c1111; --warnbg:#fff3f3;
      --c1:#ff4d4d; --c2:#7b5cff; --c3:#1ec0ff; --c4:#34d399; --c5:#fbbf24; --c6:#f97316;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    body{
      margin:0;color:var(--ink);line-height:1.5;overflow-x:hidden;
      background:
        radial-gradient(120% 120% at -10% -10%, #fbeceb 0%, transparent 60%),
        radial-gradient(120% 120% at 110% -10%, #f6d8d5 0%, transparent 60%),
        linear-gradient(180deg, #fff 0%, #fbeceb 30%, #f6d8d5 85%, #f2c4bf 100%);
    }
    header{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:12px 16px;font-weight:900}
    .wrap{max-width:980px;margin:0 auto;padding:14px}

    .status{margin:8px 0}
    .banner{padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
    .ok{background:var(--okbg);border:1px solid #a7f3d0;color:var(--ok)}
    .warn{background:var(--warnbg);border:1px solid #f6caca;color:var(--warn)}

    .stage{display:grid;place-items:center;margin:8px 0 12px}
    .wheel-wrap{position:relative;width:320px;height:320px}
    .wheel{
      width:100%;height:100%;border-radius:50%;
      border:10px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.1);
      transition:transform 1.6s cubic-bezier(.2,.9,.2,1);
      background:
        conic-gradient(
          var(--c1) 0 60deg,
          var(--c2) 60deg 120deg,
          var(--c3) 120deg 180deg,
          var(--c4) 180deg 240deg,
          var(--c5) 240deg 300deg,
          var(--c6) 300deg 360deg
        );
    }
    .slice-label{
      position:absolute;left:50%;top:50%;
      width:44%;text-align:center;color:#fff;font-weight:900;
      transform-origin:0% 0%;font-size:14px;letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.25);
    }
    .l1{transform:rotate(-90deg) translate(0,-140px)}
    .l2{transform:rotate(-30deg) translate(0,-140px)}
    .l3{transform:rotate(30deg) translate(0,-140px)}
    .l4{transform:rotate(90deg) translate(0,-140px)}
    .l5{transform:rotate(150deg) translate(0,-140px)}
    .l6{transform:rotate(210deg) translate(0,-140px)}

    .pointer{
      position:absolute;left:50%;top:50%;
      transform:translate(-50%,-50%);
      width:84px;height:84px;border-radius:50%;
      background:#111;color:#fff;display:grid;place-items:center;
      font-weight:900;z-index:2;box-shadow:0 6px 16px rgba(0,0,0,.25)
    }
    .pointer:after{
      content:"";position:absolute;top:-20px;left:50%;transform:translateX(-50%);
      border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid #111;
      filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
    }

    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .input{flex:1;min-width:240px;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;font-weight:700}
    .btn{appearance:none;border:none;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}
    .btn.red{background:var(--brand);color:#fff}
    .btn.gold{background:var(--gold);color:#111}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .tiny{font-size:12px;color:var(--muted)}

    /* Winners ticker */
    .winners{margin-top:14px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden}
    .winners h3{margin:8px 10px 0;font-size:14px;color:#7c1111}
    .ticker-viewport{height:150px;overflow:hidden;position:relative}
    .ticker-list{position:absolute;left:0;right:0;bottom:-100%;display:flex;flex-direction:column;gap:6px;padding:8px 10px}
    .winrow{display:flex;justify-content:space-between;font-weight:800}
    .amt{color:#065f46}
    .ph{color:#6b7280}
  </style>
</head>
<body>
  <header>BAM Lucky Spin</header>

  <main class="wrap">
    <div id="status" class="status"></div>

    <section class="stage">
      <div class="wheel-wrap">
        <div id="wheel" class="wheel"></div>
        <div class="pointer" id="spinCenter">Spin</div>
        <div id="l1" class="slice-label l1"></div>
        <div id="l2" class="slice-label l2"></div>
        <div id="l3" class="slice-label l3"></div>
        <div id="l4" class="slice-label l4"></div>
        <div id="l5" class="slice-label l5"></div>
        <div id="l6" class="slice-label l6"></div>
      </div>
    </section>

    <section>
      <div class="row" style="margin-bottom:10px">
        <input id="pwd" class="input" placeholder="Enter spin password (from WhatsApp group)" />
        <button id="btnGroup" class="btn gold">Group Spin</button>
        <button id="btnHeavy" class="btn red">Heavy Spin</button>
      </div>
      <div class="tiny">Both spins require a valid password. Heavy spin only works for referrers who have an eligible verified direct referee (not yet used).</div>
    </section>

    <section class="winners">
      <h3>Recent Winners</h3>
      <div class="ticker-viewport">
        <div id="ticker" class="ticker-list"></div>
      </div>
    </section>
  </main>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, collection, getDocs,
    query, where, limit, runTransaction, serverTimestamp,
    onSnapshot, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  /* ---------- Firebase Config ---------- */
  const firebaseConfig = {
    apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
    authDomain: "bam1-3d3e5.firebaseapp.com",
    projectId: "bam1-3d3e5",
    storageBucket: "bam1-3d3e5.firebasestorage.app",
    messagingSenderId: "649603741902",
    appId: "1:649603741902:web:e67f20363f485c0948789f",
    measurementId: "G-W2DY026FXB"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  /* ---------- Helper Functions ---------- */
  const $ = id => document.getElementById(id);
  const UGX = n => "UGX " + Number(n||0).toLocaleString("en-UG");
  const show = (html, ok=false)=>{ $("status").innerHTML = `<div class="banner ${ok?'ok':'warn'}">${html}</div>`; };

  const wheel = $("wheel");
  let spinLock = false;
  let me = null;
  let meDoc = null;

  const HEAVY_BY_LEVEL = {
    B1:[5000,6000,7000],
    B2:[15000,20000,30000],
    B3:[20000,30000,50000],
    B4:[30000,40000,60000],
    B5:[100000], B6:[100000], B7:[100000], B8:[100000], B9:[100000]
  };
  const GROUP_AMOUNTS = [200,300,400,500];

  function spinToIndex(idx, onDone){
    const baseTurns = 8 + Math.floor(Math.random()*3);
    const sliceDeg = 60;
    const targetDeg = (360 - (idx*sliceDeg + sliceDeg/2)) % 360;
    const final = baseTurns*360 + targetDeg;
    wheel.style.transform = `rotate(${final}deg)`;
    setTimeout(()=> onDone && onDone(), 1700);
  }

  function findVerifiedLevel(u){
    const order = ["B9","B8","B7","B6","B5","B4","B3","B2","B1"];
    for(const code of order){ if (u?.[code]?.status==="verified") return code; }
    return null;
  }

  async function loadMeDoc(){
    const uref = doc(db,'users', me.uid);
    const s = await getDoc(uref);
    meDoc = s.exists()? s.data() : {};
  }

  async function requirePassword(type){
    const code = $("pwd").value.trim();
    if (!code){ show("Enter the password first.", false); return {ok:false}; }

    const qy = query(collection(db,'spinpassword'), where('code','==', code), limit(10));
    const snap = await getDocs(qy);
    if (snap.empty){ show("Invalid or inactive password for this spin type.", false); return {ok:false}; }

    let match = null;
    for (const d of snap.docs){
      const data = d.data();
      if (String(data.type||'').toLowerCase() === type && data.active === true){
        match = { id:d.id, data, code };
        break;
      }
    }
    if (!match){ show("Invalid or inactive password for this spin type.", false); return {ok:false}; }
    return { ok:true, ...match };
  }

  async function alreadyUsedPassword(passId){
    const pref = doc(db,'spinpassword', passId);
    const s = await getDoc(pref);
    const usedBy = s.exists()? (s.data().usedBy || {}) : {};
    return usedBy[me.uid] === true;
  }

  async function getEligibleReferee(){
    const qs = query(collection(db,'users'), where('refA_uid','==', me.uid));
    const snap = await getDocs(qs);
    const candidates = [];
    snap.forEach(d=>{
      const u = d.data();
      const lvl = findVerifiedLevel(u);
      if (lvl) candidates.push({ uid:u.uid || d.id, level:lvl });
    });
    if (!candidates.length) return null;

    const usedSnap = await getDocs(query(collection(db,'spins'),
      where('uid','==', me.uid), where('type','==','heavy')
    ));
    const used = new Set();
    usedSnap.forEach(d=>{ const v=d.data(); if(v.refereeUid) used.add(v.refereeUid); });
    const available = candidates.filter(c=> !used.has(c.uid));
    if (!available.length) return null;
    return available[Math.floor(Math.random()*available.length)];
  }

  async function getLastByLevel(){
    const mref = doc(db,'lucky_meta', me.uid);
    const s = await getDoc(mref);
    return s.exists()? (s.data().lastByLevel || {}) : {};
  }

  async function setLastByLevel(level, amount){
    const mref = doc(db,'lucky_meta', me.uid);
    await setDoc(mref, { lastByLevel: { [level]: amount } }, { merge:true });
  }

  function pickRandomDifferent(list, last){
    if (list.length===1) return list[0];
    let candidate = list[Math.floor(Math.random()*list.length)];
    if (candidate===last){
      const alts = list.filter(x=>x!==last);
      candidate = alts[Math.floor(Math.random()*alts.length)];
    }
    return candidate;
  }

  /* ---------- SPINS ---------- */
  async function doHeavySpin(){
    if (spinLock) return;
    if (!meDoc || !findVerifiedLevel(meDoc)){ show("You must be verified to spin.", false); return; }
    spinLock = true; $("btnHeavy").disabled = true; $("btnGroup").disabled = true;

    try{
      const pass = await requirePassword('heavy');
      if (!pass.ok) return;
      if (await alreadyUsedPassword(pass.id)){ show("You have already used this password.", false); return; }

      const ref = await getEligibleReferee();
      if (!ref){ show("No eligible heavy spin. You must have a verified direct referee not yet used.", false); return; }

      const options = HEAVY_BY_LEVEL[ref.level] || [100000];
      const lastMap = await getLastByLevel();
      const chosen = pickRandomDifferent(options, lastMap[ref.level]);
      const targetIndex = Math.floor(Math.random()*6);

      // --- ALL READS ABOVE ---
      spinToIndex(targetIndex, async ()=>{
        try{
          await runTransaction(db, async (tx)=>{
            // perform all reads first inside transaction
            const uref = doc(db,'users', me.uid);
            const pref = doc(db,'spinpassword', pass.id);
            const uSnap = await tx.get(uref);
            const pSnap = await tx.get(pref);

            const udata = uSnap.exists()? uSnap.data(): {};
            const curPref = pSnap.exists()? pSnap.data(): {};

            if (curPref.usedBy?.[me.uid] === true) throw new Error("You have already used this password.");

            const newCom = Number(udata.commissionWallet||0) + Number(chosen);
            const usedCount = Number(curPref.usedCount||0);

            // all writes after reads
            tx.set(uref, { commissionWallet:newCom }, { merge:true });
            const sref = doc(collection(db,'spins'));
            tx.set(sref, {
              uid: me.uid, type:'heavy', amount: chosen,
              refereeUid: ref.uid, refereeLevel: ref.level,
              passwordCode: pass.code,
              createdAt: serverTimestamp(), indexLanded: targetIndex
            });
            tx.set(pref, { usedBy: { ...(curPref.usedBy||{}), [me.uid]: true }, usedCount: usedCount + 1 }, { merge:true });
          });
          await setLastByLevel(ref.level, chosen);
          show(`Heavy spin added ${UGX(chosen)}.`, true);
        }catch(e){ console.error(e); show(e.message || "Failed to save heavy spin."); }
        finally{ $("btnHeavy").disabled = false; $("btnGroup").disabled = false; spinLock=false; }
      });
    }catch(e){ console.error(e); show("Heavy spin failed."); $("btnHeavy").disabled = false; $("btnGroup").disabled = false; spinLock=false; }
  }

  async function doGroupSpin(){
    if (spinLock) return;
    if (!meDoc || !findVerifiedLevel(meDoc)){ show("You must be verified to spin.", false); return; }
    spinLock = true; $("btnHeavy").disabled = true; $("btnGroup").disabled = true;

    try{
      const pass = await requirePassword('group');
      if (!pass.ok) return;

      const chosen = GROUP_AMOUNTS[Math.floor(Math.random()*GROUP_AMOUNTS.length)];
      const idx = Math.floor(Math.random()*6);

      // --- All reads before writes ---
      const prefRef = doc(db,'spinpassword', pass.id);
      const prefSnap = await getDoc(prefRef);
      if (!prefSnap.exists()) throw new Error("Password not found.");
      const cur = prefSnap.data();
      if ((cur.usedBy||{})[me.uid] === true) throw new Error("You have already used this password.");
      const used = Number(cur.usedCount||0);
      const max  = Number(cur.maxWinners||10);
      if (used >= max) throw new Error("This group spin is already full");

      spinToIndex(idx, async ()=>{
        try{
          await runTransaction(db, async (tx)=>{
            // read inside transaction first
            const uref = doc(db,'users', me.uid);
            const uSnap = await tx.get(uref);
            const udata = uSnap.exists()? uSnap.data(): {};
            const newCom = Number(udata.commissionWallet||0) + Number(chosen);

            // all writes after reads
            tx.set(uref, { commissionWallet:newCom }, { merge:true });
            const sref = doc(collection(db,'spins'));
            tx.set(sref, {
              uid: me.uid, type:'group', amount: chosen, passwordCode: pass.code,
              createdAt: serverTimestamp(), indexLanded: idx
            });
            tx.set(prefRef, { usedBy: { ...(cur.usedBy||{}), [me.uid]: true }, usedCount: used + 1 }, { merge:true });
          });
          show(`Group spin added ${UGX(chosen)}.`, true);
        }catch(e){ console.error(e); show(e.message || "Failed to save group spin."); }
        finally{ $("btnHeavy").disabled = false; $("btnGroup").disabled = false; spinLock=false; }
      });
    }catch(e){ console.error(e);
      show(e.message || "Group spin failed.");
      $("btnHeavy").disabled=false; $("btnGroup").disabled=false; spinLock=false;
    }
  }

  /* ------- Winners ticker ------- */
  const userPhoneCache = new Map();
  const maskPhone = (p)=>{
    if (!p) return "********";
    const s = String(p).replace(/\s+/g,'');
    if (s.length <= 5) return "***" + s.slice(-2);
    return s.slice(0,3) + "****" + s.slice(-2);
  };
  async function getPhone(uid){
    if (!uid) return "";
    if (userPhoneCache.has(uid)) return userPhoneCache.get(uid);
    const uref = doc(db,'users', uid);
    const snap = await getDoc(uref);
    const phone = snap.exists()? (snap.data().phone || (snap.data().depositNumbers?.[0]?.phone) || "") : "";
    userPhoneCache.set(uid, phone);
    return phone;
  }

  function renderTickerRows(spins){
    const items = spins.map(v=>{
      const phone = maskPhone(v.phone || "");
      return `<div class="winrow"><span class="ph">${phone}</span><span class="amt">+${UGX(v.amount||0)}</span></div>`;
    });
    const el = $("ticker");
    el.innerHTML = items.join("") || `<div class="winrow"><span class="ph">No winners yet</span><span class="amt"></span></div>`;
    const SPEED = 130, distance = el.scrollHeight + 16, duration = Math.max(3, distance / SPEED);
    el.style.transition = "none"; el.style.transform = "translateY(0)";
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      el.style.transition = `transform ${duration}s linear`;
      el.style.transform = `translateY(-${distance}px)`;
    });});
  }

  async function buildRowsFromSnapshot(snap){
    const docs = snap.docs || [];
    const payloads = await Promise.all(docs.map(async d=>{
      const v = d.data() || {};
      const phone = await getPhone(v.uid || "");
      return { amount: v.amount || 0, phone };
    }));
    renderTickerRows(payloads);
  }

  async function loadWinnersOnce(){
    const qy = query(collection(db,'spins'), orderBy('createdAt','desc'), limit(30));
    const snap = await getDocs(qy);
    await buildRowsFromSnapshot(snap);
  }

  function startTicker(){
    const qy = query(collection(db,'spins'), orderBy('createdAt','desc'), limit(30));
    onSnapshot(qy, {
      next: async (snap)=>{ try{ await buildRowsFromSnapshot(snap); }catch(e){ console.error(e); } },
      error: async (err)=>{
        console.warn("Realtime winners failed; falling back to one-time fetch.", err);
        try{ await loadWinnersOnce(); }catch(e){ console.error("Fallback winners fetch failed", e); }
      }
    });
  }

  onAuthStateChanged(auth, async (u)=>{
    if (!u){ location.href="login.html"; return; }
    me = u;
    await loadMeDoc();
    show("Enter the password and pick a spin.", true);
    startTicker();
  });

  $("btnHeavy").addEventListener("click", doHeavySpin);
  $("btnGroup").addEventListener("click", doGroupSpin);
</script>
</body>
</html>
