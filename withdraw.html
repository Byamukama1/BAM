<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAM • Withdraw</title>
  <style>
    :root{
      --brand:#9b1c1c; --brand-d:#7c1111; --gold:#fbbf24;
      --bg:#fff7f7; --card:#ffffff; --ink:#0f172a; --muted:#6b7280;
      --ok:#065f46; --ok-bg:#ecfdf5; --warn:#7c1111; --warn-bg:#fff1f1;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    body{margin:0;background:var(--bg);color:var(--ink)}
    header{
      background:linear-gradient(135deg,var(--brand),var(--brand-d));
      color:#fff;padding:12px 14px;font-weight:900;letter-spacing:.3px
    }
    .wrap{max-width:900px;margin:0 auto;padding:14px}
    .card{background:var(--card);border-radius:16px;box-shadow:0 12px 26px rgba(0,0,0,.06);padding:14px;margin:10px 0}
    .row{display:grid;gap:10px}
    @media(min-width:720px){ .row{grid-template-columns:1fr 1fr} }
    label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
    input[type="text"]{
      width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:12px;font-weight:600
    }
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{
      padding:10px 12px;border:1px solid #f3cf69;background:#fff6e0;border-radius:12px;font-weight:900;cursor:pointer;
    }
    .chip.active{background:var(--gold);border-color:#d6b338}
    .btn{
      appearance:none;border:none;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer;
      background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 10px 20px rgba(155,28,28,.25)
    }
    .btn.secondary{background:#eef2ff;color:#111;border:1px solid #c7d2fe;box-shadow:none}
    .btn.small{padding:8px 10px;border-radius:10px;font-weight:800}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .banner{margin:10px 0;padding:10px 12px;border-radius:12px;border:2px solid var(--warn);background:var(--warn-bg);color:var(--warn);font-weight:700}
    .banner.ok{border-color:#34d399;background:var(--ok-bg);color:var(--ok)}
    .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;font-size:13px}
    .muted{color:var(--muted);font-size:12px}
    .list{margin-top:12px}
    .item{display:flex;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #f1d4d4}
    .amt{font-weight:900}
    .status{font-weight:900}
    .status.pending{color:#7c1111}
    .status.paid{color:#065f46}
    .status.rejected{color:#7c1111}
    .nav{
      position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
      display:flex;justify-content:space-around;padding:10px 8px 12px;z-index:10;backdrop-filter:blur(4px);
      box-shadow:0 -6px 20px rgba(0,0,0,.06)
    }
    .nav a{flex:1;text-align:center;text-decoration:none;color:#6b4a4a;font-size:12px;padding:6px 0;border-radius:16px;margin:0 4px;transition:.15s}
    .nav a.active{color:#fff;background:var(--brand);box-shadow:0 6px 16px rgba(155,28,28,.25);font-weight:800}
    .nav .n-ico{display:block;font-size:20px;margin-bottom:4px}
  </style>
</head>
<body>
  <header>Withdraw</header>

  <main class="wrap">
    <div id="statusArea"></div>

    <section class="card">
      <div class="kv">
        <div class="box"><b>Commission wallet</b><br><span id="balance">UGX 0</span></div>
        <div class="box"><b>Verified level</b><br><span id="levelTag">INTERN</span></div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div>
          <label>Registered name</label>
          <input id="regName" type="text" placeholder="e.g. Jane Doe" />

          <label style="margin-top:10px">Phone number</label>
          <input id="regPhone" type="text" inputmode="numeric" placeholder="07XXXXXXXX" />

          <div style="margin-top:8px;display:flex;gap:8px">
            <button id="saveNumBtn" class="btn secondary small">Save number</button>
          </div>
          <div class="muted" style="margin-top:6px">
            You can keep <b>one</b> registered number. Edit the fields above to change it.
          </div>
        </div>

        <div>
          <label>Amount</label>
          <div class="chips" id="amountChips"></div>
        </div>
      </div>

      <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
        <button id="submitBtn" class="btn">Submit</button>
        <div class="muted">Withdraw takes less than 48 hours</div>
      </div>

      <div class="list" id="history"></div>
    </section>
  </main>

  <nav class="nav">
    <a href="index.html"><span class="n-ico">🏠</span>Home</a>
    <a href="tasks.html"><span class="n-ico">🗂️</span>Tasks</a>
    <a href="levels.html"><span class="n-ico">🎖️</span>Levels</a>
    <a href="profit.html"><span class="n-ico">💹</span>Profit</a>
    <a class="active" href="account.html"><span class="n-ico">👤</span>Account</a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, runTransaction,
      collection, query, where, getDocs, serverTimestamp, orderBy, limit, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
      authDomain: "bam1-3d3e5.firebaseapp.com",
      projectId: "bam1-3d3e5",
      storageBucket: "bam1-3d3e5.firebasestorage.app",
      messagingSenderId: "649603741902",
      appId: "1:649603741902:web:e67f20363f485c0948789f",
      measurementId: "G-W2DY026FXB"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id)=>document.getElementById(id);
    const UGX = (n)=>"UGX " + Number(n||0).toLocaleString("en-UG");
    const todayKey = ()=> new Date().toISOString().slice(0,10);

    const LEVELS_DESC = ["B10","B9","B8","B7","B6","B5","B4","B3","B2","B1"];
    const MIN_BY_LEVEL = {
      INTERN: 5000, B1: 3000, B2: 5000, B3: 15000, B4: 45000,
      B5: 150000, B6: 370000, B7: 980000, B8: 3000000, B9: 8500000, B10: 15000000,
    };
    const LADDER = [3000,5000,15000,45000,150000,370000,980000,3000000,8500000,15000000];

    function highestVerifiedLevel(u){
      for (const code of LEVELS_DESC){
        if (u?.[code]?.status === "verified") return code;
      }
      return "INTERN";
    }
    function allowedAmounts(level){
      const min = MIN_BY_LEVEL[level] ?? 5000;
      return LADDER.filter(v => v >= min);
    }
    function show(msg, ok=false){
      $("statusArea").innerHTML = `<div class="banner ${ok?'ok':''}">${msg}</div>`;
    }
    function isBlockedDay(){
      const d = new Date().getDay();
      return d === 0 || d === 6;
    }

    async function alreadyWithdrewToday(uid){
      const qy = query(collection(db,"withdraws"),
        where("uid","==", uid),
        where("dateKey","==", todayKey())
      );
      const snap = await getDocs(qy);
      return !snap.empty;
    }

    async function refundPendingWithdraws(uid){
      const qy = query(collection(db,"withdraws"),
        where("uid","==", uid),
        where("status","==","pending")
      );
      const snap = await getDocs(qy);
      if (snap.empty) return 0;
      let totalRefunded = 0;

      for (const docSnap of snap.docs){
        const w = docSnap.data();
        const amount = Number(w.amount||0);
        totalRefunded += amount;

        await runTransaction(db, async (tx)=>{
          const uref = doc(db,"users",uid);
          const usnap = await tx.get(uref);
          const userData = usnap.exists() ? usnap.data() : {};
          const newBalance = Number(userData.commissionWallet||0) + amount;

          tx.update(uref,{ commissionWallet: newBalance, updatedAt: serverTimestamp() });
          tx.update(docSnap.ref, { status:"refunded", refundedAt: serverTimestamp() });
        });

        await deleteDoc(docSnap.ref);
      }
      return totalRefunded;
    }

    function normalizeSingle(arr){
      if (!Array.isArray(arr) || !arr.length) return { phone:"", name:"" };
      const v = typeof arr[0] === "string" ? { phone: arr[0], name:"" } : arr[0];
      return { phone: String(v.phone||""), name: String(v.name||"") };
    }

    function renderAmountChips(list){
      const box = $("amountChips"); box.innerHTML = "";
      list.forEach(v=>{
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = Number(v).toLocaleString("en-UG");
        chip.dataset.amount = v;
        chip.addEventListener("click", ()=>{
          box.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
          chip.classList.add("active");
        });
        box.appendChild(chip);
      });
      const first = box.querySelector(".chip"); if (first) first.classList.add("active");
    }

    function fmtDate(ts){
      try{ if (ts?.toDate) return ts.toDate().toLocaleString(); }catch{}
      return new Date().toLocaleString();
    }

    async function loadHistory(uid){
      const list = $("history");
      list.innerHTML = `<div class="muted">Loading recent withdrawals…</div>`;
      try{
        const qy = query(
          collection(db,"withdraws"),
          where("uid","==", uid),
          orderBy("createdAt","desc"),
          limit(20)
        );
        const snap = await getDocs(qy);
        if (snap.empty){ list.innerHTML = `<div class="muted">No withdrawals yet.</div>`; return; }
        list.innerHTML = "";
        snap.forEach(d=>{
          const w = d.data();
          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML = `
            <div>
              <div class="amt">${UGX(w.amount||0)}</div>
              <div class="muted">${w.method||"—"}</div>
            </div>
            <div style="text-align:right">
              <div class="status ${String(w.status||'pending').toLowerCase()}">${w.status||'pending'}</div>
              <div class="muted">${fmtDate(w.createdAt)}</div>
            </div>`;
          list.appendChild(row);
        });
      }catch(e){
        console.error(e);
        list.innerHTML = `<div class="muted">Could not load history.</div>`;
      }
    }

    onAuthStateChanged(auth, async (user)=>{
      if (!user){ location.href = "login.html"; return; }
      const uid = user.uid;
      const uRef = doc(db,"users",uid);
      const uSnap = await getDoc(uRef);
      const u = uSnap.exists() ? uSnap.data() : {};

      const level = highestVerifiedLevel(u);
      $("levelTag").textContent = level;
      renderAmountChips(allowedAmounts(level));

      if (level === "INTERN"){
        const refunded = await refundPendingWithdraws(uid);
        if (refunded > 0){
          show(`UGX ${refunded.toLocaleString("en-UG")} refunded to your wallet. Interns cannot withdraw.`, true);
        }
        show(`The purpose of internship is to learn how to do daily tasks. For income and withdrawals, you can become our employee by joining any level. Thank you.`, false);
        $("submitBtn").disabled = true;
      }

      let single = normalizeSingle(u.depositNumbers);
      $("regName").value = single.name || "";
      $("regPhone").value = single.phone || "";

      $("saveNumBtn").onclick = async ()=>{
        single = {
          name: ($("regName").value||"").trim(),
          phone: ($("regPhone").value||"").trim()
        };
        await setDoc(uRef, { depositNumbers: [single] }, { merge:true });
        show("Registered number saved.", true);
      };

      $("balance").textContent = UGX(u.commissionWallet || 0);

      if (isBlockedDay()){
        show("Withdrawals are closed on Saturdays and Sundays.");
        $("submitBtn").disabled = true;
      }

      await loadHistory(uid);

      $("submitBtn").onclick = async ()=>{
        const activeChip = document.querySelector(".chip.active");
        const amount = activeChip ? Number(activeChip.dataset.amount) : 0;
        const phone = ($("regPhone").value||"").trim();
        const name  = ($("regName").value||"").trim();
        if (!amount){ show("Select an amount."); return; }
        if (!phone){ show("Enter your registered phone number."); return; }

        const methodLabel = (name ? `${name} — ${phone}` : phone);

        try{
          if (await alreadyWithdrewToday(uid)){
            show("You have already made a withdrawal today. Try again tomorrow.");
            return;
          }
          if (isBlockedDay()){
            show("Withdrawals are closed on Saturdays and Sundays."); return;
          }

          await runTransaction(db, async (tx)=>{
            const ref = doc(db,"users",uid);
            const snap = await tx.get(ref);
            if (!snap.exists()) throw new Error("User not found.");
            const data = snap.data();
            const balance = Number(data.commissionWallet || 0);
            if (balance < amount) throw new Error("Insufficient commission wallet balance.");

            tx.set(ref, { depositNumbers: [{ phone, name }], commissionWallet: balance - amount, updatedAt: serverTimestamp() }, { merge:true });

            const wRef = doc(collection(db,"withdraws"));
            tx.set(wRef, {
              uid,
              amount,
              method: methodLabel,
              methodPhone: phone || null,
              methodName: name || null,
              status: "pending",
              dateKey: todayKey(),
              createdAt: serverTimestamp(),
              levelUsed: level
            });
          });

          show(`Withdrawal submitted: ${UGX(amount)} → ${methodLabel}. Status: pending.`, true);
          $("submitBtn").disabled = true;
          await loadHistory(uid);
          $("balance").textContent = UGX((u.commissionWallet||0) - amount);
        }catch(e){
          console.error(e);
          show(e.message || "Failed to submit withdrawal.");
        }
      };
    });
    </script>
</body>
</html>
