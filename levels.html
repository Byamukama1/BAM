<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAM • Employee Levels</title>
  <style>
    :root { --primary:#9b1c1c; --primary-dark:#7c1111; --secondary:#fbbf24; --text:#161617; --muted:#6b7280; --success:#10b981; --error:#ef4444; }
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    body{background:#fdf2f0;color:var(--text);line-height:1.55}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px;text-align:center;border-radius:12px;margin-bottom:16px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
    .user-info{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
    .wallet{font-weight:800;color:var(--primary)}
    .levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:40px}
    .level-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.06);transition:.2s}
    .level-card:hover{transform:translateY(-3px)}
    .level-header{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
    .lv-name{font-size:22px;font-weight:900}
    .lv-deposit{font-size:22px;font-weight:900}
    .level-content{padding:14px 16px}
    .bar{display:flex;gap:14px;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-top:10px}
    .chip{font-size:13px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:6px 10px}
    .join-btn{margin-left:auto;appearance:none;border:none;border-radius:10px;padding:8px 12px;font-weight:800;background:var(--secondary);color:#111;cursor:pointer}
    .join-btn[disabled]{opacity:.55;cursor:not-allowed}
    .status{display:inline-block;width:100%;text-align:center;margin-top:10px;border-radius:999px;padding:6px 10px;font-size:13px}
    .status.under{background:#fef3c7;color:#92400e}
    .status.member{background:#d1fae5;color:#065f46}
    .banner{background:#fff3f3;border:1px solid #f6caca;color:#7c1111;padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
    .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center}
    .modal .box{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:92%}
    .modal .actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
    .btn{padding:8px 14px;border:none;border-radius:10px;cursor:pointer}
    .btn.cancel{background:#e5e7eb}
    .btn.confirm{background:var(--primary);color:#fff}
    .note{position:fixed;right:16px;bottom:16px;background:var(--success);color:#fff;padding:12px 14px;border-radius:12px;display:none;font-weight:800}
    .note.err{background:var(--error)}
    @media (max-width:768px){.levels-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Employee Level</h1>
      <p>Upgrade your membership to access more tasks and higher earnings</p>
    </header>

    <div class="user-info">
      <div><span id="user-name">Loading…</span></div>
      <div class="wallet">Balance: <span id="wallet-balance">UGX 0</span></div>
    </div>

    <div id="statusArea"></div>
    <div class="levels-grid" id="levels-container"></div>
  </div>

  <!-- Confirm modal -->
  <div class="modal" id="confirmModal">
    <div class="box">
      <h2 style="margin-bottom:8px">Confirm Level Upgrade</h2>
      <div id="modalMsg">—</div>
      <div class="actions">
        <button class="btn cancel" id="cancelBtn">Cancel</button>
        <button class="btn confirm" id="confirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <div class="note" id="note">Done</div>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
      authDomain: "bam1-3d3e5.firebaseapp.com",
      projectId: "bam1-3d3e5",
      storageBucket: "bam1-3d3e5.firebasestorage.app",
      messagingSenderId: "649603741902",
      appId: "1:649603741902:web:e67f20363f485c0948789f",
      measurementId: "G-W2DY026FXB"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const UGX = n => "UGX " + Number(n||0).toLocaleString("en-UG");
    const show = (msg, ok=false)=>{ document.getElementById('statusArea').innerHTML =
      `<div class="banner ${ok?'ok':''}">${msg}</div>`; };
    const toast = (msg, err=false)=>{ const n=document.getElementById('note'); n.textContent=msg; n.classList.toggle('err',err); n.style.display='block'; setTimeout(()=>n.style.display='none',2800); };

    // ===== Levels (B1 added at 30000, others shifted) =====
    const LEVELS = [
      { id:'B1', name:'B1', deposit:   30000, each: 250, daily: 4,  grad:['#06b6d4','#0ea5e9'] },
      { id:'B2', name:'B2', deposit:   80000, each: 330, daily: 7,  grad:['#0ea5e9','#2563eb'] },
      { id:'B3', name:'B3', deposit:  229000, each: 430, daily:17,  grad:['#7c3aed','#4f46e5'] },
      { id:'B4', name:'B4', deposit:  625000, each: 735, daily:28,  grad:['#0284c7','#0ea5e9'] },
      { id:'B5', name:'B5', deposit: 1940000, each:1200, daily:54,  grad:['#8b5cf6','#7c3aed'] },
      { id:'B6', name:'B6', deposit: 5210000, each:2250, daily:80,  grad:['#16a34a','#22c55e'] },
      { id:'B7', name:'B7', deposit:13480000, each:3700, daily:130, grad:['#f97316','#fb923c'] },
      { id:'B8', name:'B8', deposit:30010000, each:6500, daily:175, grad:['#ef4444','#f43f5e'] },
      { id:'B9', name:'B9', deposit:60010000, each:8750, daily:260, grad:['#0284c7','#2563eb'] },
      { id:'B10',name:'B10',deposit:99010000, each:15000,daily:300, grad:['#6d28d9','#7c3aed'] },
    ];

    let currentUser=null, userData=null, chosen=null;

    const levelIndex = id => LEVELS.findIndex(l => l.id === id);
    function getCurrentLevelId() {
      for (let i=LEVELS.length-1; i>=0; i--){
        const id = LEVELS[i].id;
        if (userData && userData[id] && userData[id].status === 'verified') return id;
      }
      return 'INTERN';
    }

    function renderLevels(){
      const wrap = document.getElementById('levels-container');
      wrap.innerHTML = '';
      const currentId = getCurrentLevelId();
      const internIsCurrent = (currentId === 'INTERN');

      const intern = document.createElement('section');
      intern.className='level-card';
      intern.innerHTML = `
        <div class="level-header" style="background:linear-gradient(135deg,#9ca3af,#6b7280)">
          <div class="lv-name">intern</div>
          <div class="lv-deposit">${UGX(0)}</div>
        </div>
        <div class="level-content">
          <div class="bar">
            <span class="chip">Each Task: ${UGX(300)}</span>
            <span class="chip">Daily tasks: 5</span>
            <button class="join-btn" disabled>${internIsCurrent ? 'Current' : '—'}</button>
          </div>
          ${internIsCurrent ? '<div class="status member">Status: current</div>' : ''}
        </div>`;
      wrap.appendChild(intern);

      LEVELS.forEach(lv=>{
        const status = userData?.[lv.id]?.status;
        const verified = status==='verified';
        const under = status==='under_review';
        const member = status==='joined' || verified;
        const isCurrent = (currentId === lv.id);

        const card = document.createElement('section');
        card.className='level-card';
        card.innerHTML = `
          <div class="level-header" style="background:linear-gradient(135deg, ${lv.grad[0]}, ${lv.grad[1]})">
            <div class="lv-name">${lv.name}</div>
            <div class="lv-deposit">${UGX(lv.deposit)}</div>
          </div>
          <div class="level-content">
            <div class="bar">
              <span class="chip">Each Task: ${UGX(lv.each)}</span>
              <span class="chip">Daily tasks: ${lv.daily}</span>
              <button class="join-btn" data-level="${lv.id}" ${under||member?'disabled':''}>
                ${isCurrent ? 'Current' : under ? 'Under review' : member ? 'Already Joined' : 'Join now'}
              </button>
            </div>
            <div style="margin-top:8px;color:${under?'#92400e':'#64748b'};font-size:13px">
              Required to join: <b>${UGX(lv.deposit)}</b>
            </div>
            ${under?'<div class="status under">Status: under review</div>':''}
            ${isCurrent?'<div class="status member">Status: current</div>': member?'<div class="status member">Status: member</div>':''}
          </div>`;
        wrap.appendChild(card);
      });

      document.querySelectorAll('.join-btn[data-level]').forEach(btn=>{
        btn.addEventListener('click', onJoinClick);
      });
    }

    const modal = document.getElementById('confirmModal');
    const modalMsg = document.getElementById('modalMsg');
    document.getElementById('cancelBtn').onclick = ()=> modal.style.display='none';
    document.getElementById('confirmBtn').onclick = confirmJoin;

    function onJoinClick(e){
      const id = e.currentTarget.getAttribute('data-level');
      chosen = LEVELS.find(x=>x.id===id);
      if (!currentUser){ toast('Please log in first', true); return; }

      const currentId = getCurrentLevelId();
      if (currentId !== 'INTERN') {
        if (levelIndex(chosen.id) < levelIndex(currentId)) {
          toast(`You cannot join a lower level than your current verified level (${currentId}).`, true);
          return;
        }
      }

      const need = chosen.deposit;
      if ((userData?.mainWallet||0) < need){ toast('Insufficient balance', true); return; }
      modalMsg.textContent = `Join ${chosen.name} for ${UGX(need)}. This will be deducted from your main wallet.`;
      modal.style.display='flex';
    }

    async function confirmJoin(){
      modal.style.display='none';
      if (!currentUser || !chosen) return;
      const userRef = db.collection('users').doc(currentUser.uid);
      try{
        await db.runTransaction(async (tx)=>{
          const snap = await tx.get(userRef);
          if (!snap.exists) throw new Error('User not found');
          const u = snap.data();
          const need = chosen.deposit;

          if (u[chosen.id]?.status === 'under_review' || u[chosen.id]?.status === 'joined' || u[chosen.id]?.status === 'verified'){
            throw new Error(`You already have ${chosen.id} in progress or joined.`);
          }
          if ((u.mainWallet||0) < need){
            throw new Error('Insufficient balance');
          }

          tx.update(userRef, {
            mainWallet: (u.mainWallet||0) - need,
            [chosen.id]: {
              status: 'under_review',
              joinedAt: new Date(),
              amountPaid: need
            }
          });
        });
        show(`Request submitted for ${chosen.name}. ${UGX(chosen.deposit)} deducted from main wallet.`, true);
        await loadUser();
      }catch(err){
        console.error(err);
        show(err.message || 'Failed to join level');
        toast(err.message || 'Error', true);
      }
    }

    async function loadUser(){
      const uref = db.collection('users').doc(currentUser.uid);
      const snap = await uref.get();
      if (snap.exists){
        userData = snap.data();
        document.getElementById('wallet-balance').textContent = UGX(userData.mainWallet || 0);
      }
      renderLevels();
    }

    auth.onAuthStateChanged(async (user)=>{
      if (!user){ location.href='login.html'; return; }
      currentUser = user;
      document.getElementById('user-name').textContent = user.displayName || user.email || 'User';
      await loadUser();
    });

    renderLevels();
  </script>
</body>
</html>
