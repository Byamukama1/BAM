<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAM • Levels</title>
  <style>
    :root{
      --brand-red:#9b1c1c; --brand-red-d:#7c1111; --brand-gold:#fbbf24;
      --ink:#161617; --muted:#6b7280;
      --rose-25:#fbeceb; --rose-50:#f6d8d5; --rose-75:#f2c4bf;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    body{
      margin:0;color:var(--ink);
      background:
        radial-gradient(120% 120% at -10% -10%, var(--rose-25) 0%, transparent 60%),
        radial-gradient(120% 120% at 110% -10%, var(--rose-50) 0%, transparent 60%),
        linear-gradient(180deg, #fff 0%, var(--rose-25) 30%, var(--rose-50) 85%, var(--rose-75) 100%);
    }
    header{
      background:linear-gradient(135deg,var(--brand-red),var(--brand-red-d));
      color:#fff;padding:14px 16px;font-weight:800;letter-spacing:.3px
    }
    .wrap{max-width:1100px;margin:0 auto;padding:12px 14px 96px}

    .top{
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;
      background:#fff;border:1px solid #f1d3d3;border-radius:14px;
      padding:10px 12px;box-shadow:0 10px 24px rgba(0,0,0,.05);margin:12px 0
    }
    .pill{background:#fff6e0;border:1px solid #f3cf69;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:#7c1111}
    .muted{color:var(--muted);font-size:12px}
    .grid{display:grid;gap:14px}

    /* Level cards (look like your screenshots) */
    .level{
      border-radius:20px;overflow:hidden;color:#0f172a;
      box-shadow:0 10px 24px rgba(0,0,0,.06);background:#fff
    }
    .lv-head{
      display:flex;justify-content:space-between;align-items:center;
      padding:16px;border-bottom:12px solid rgba(0,0,0,.05);
      color:#fff;font-weight:900;letter-spacing:.2px
    }
    .lv-name{font-size:20px;text-transform:uppercase}
    .lv-amount{font-size:20px}
    .lv-foot{
      display:flex;align-items:center;gap:12px;
      background:#f8fafc;padding:10px 12px
    }
    .lv-chip{font-size:14px;color:#0f172a;opacity:.9}
    .lv-chip b{color:#1f2937}
    .spacer{flex:1}
    .btn{
      appearance:none;border:none;border-radius:12px;padding:10px 14px;
      font-weight:800;cursor:pointer;background:var(--brand-gold);color:#111
    }
    .btn[disabled]{opacity:.55;cursor:not-allowed}

    .banner{background:#fff3f3;border:1px solid #f6caca;color:#7c1111;padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
    .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}

    /* Bottom nav */
    .nav{
      position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
      display:flex;justify-content:space-around;padding:10px 8px 12px;z-index:10;backdrop-filter:blur(4px);
      box-shadow:0 -6px 20px rgba(0,0,0,.06)
    }
    .nav a{flex:1;text-align:center;text-decoration:none;color:#6b4a4a;font-size:12px;padding:6px 0;border-radius:16px;margin:0 4px;transition:.15s}
    .nav a.active{color:#fff;background:var(--brand-red);box-shadow:0 6px 16px rgba(155,28,28,.25);font-weight:800}
    .nav .n-ico{display:block;font-size:20px;margin-bottom:4px}

    /* Full-page loading */
    .overlay{position:fixed;inset:0;background:rgba(255,255,255,.96);display:grid;place-items:center;z-index:9999}
    .overlay .box{background:#fff;border:1px solid #f6caca;border-radius:14px;padding:16px 18px;text-align:center;color:#7c1111;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.08)}
    .spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(155,28,28,.2);border-top-color:var(--brand-red);animation:spin .8s linear infinite;margin:0 auto 10px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header>BAM • Levels</header>

  <!-- Full-page loader -->
  <div id="pageLoading" class="overlay" aria-live="polite">
    <div class="box">
      <div class="spinner"></div>
      <div>Loading levels…</div>
      <div class="muted" style="margin-top:6px">Your balance and join options will appear shortly.</div>
    </div>
  </div>

  <main class="wrap">
    <div id="statusArea"></div>
    <section class="top">
      <div class="pill" id="balancePill">Balance: UGX 0</div>
      <div class="pill" id="levelPill">Level: Intern</div>
      <div class="muted" id="statusPill">Status: —</div>
    </section>

    <div id="list" class="grid"></div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="nav">
    <a href="index.html"><span class="n-ico">🏠</span>Home</a>
    <a href="tasks.html"><span class="n-ico">🗂️</span>Tasks</a>
    <a class="active" href="levels.html" aria-current="page"><span class="n-ico">🎖️</span>Levels</a>
    <a href="profit.html"><span class="n-ico">💹</span>Profit</a>
    <a href="account.html"><span class="n-ico">👤</span>Account</a>
  </nav>

  <script type="module">
    /* Firebase */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, doc, getDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
      authDomain: "bam1-3d3e5.firebaseapp.com",
      projectId: "bam1-3d3e5",
      storageBucket: "bam1-3d3e5.firebasestorage.app",
      messagingSenderId: "649603741902",
      appId: "1:649603741902:web:e67f20363f485c0948789f",
      measurementId: "G-W2DY026FXB"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* Helpers */
    const $ = (id)=>document.getElementById(id);
    const fmtUGX = (n)=>"UGX " + Number(n||0).toLocaleString("en-UG");
    const hideOverlay = () => { const o = $("#pageLoading"); if (o) o.style.display = "none"; };
    const showBanner = (msg, ok=false)=>{
      const area = $("#statusArea"); if (!area) return;
      area.innerHTML = `<div class="banner${ok?' ok':''}">${msg}</div>`;
    };
    const grad = (a,b)=>`linear-gradient(135deg, ${a}, ${b})`;

    // Intern (display only)
    const INTERN = { title:"intern", deposit:0, perTask:300, dailyTasks:5, colors:["#9aa0a6","#80868b"] };

    // B1…B9 base deposits (we add +10,000 on join)
    const LEVELS = [
      { code:"B1", deposit:  70000, perTask:  330, dailyTasks:  7, colors:["#1e3a8a","#60a5fa"] },
      { code:"B2", deposit: 219000, perTask:  430, dailyTasks: 17, colors:["#4c1d95","#a78bfa"] },
      { code:"B3", deposit: 615000, perTask:  735, dailyTasks: 28, colors:["#0c4a6e","#38bdf8"] },
      { code:"B4", deposit:1930000, perTask: 1200, dailyTasks: 54, colors:["#5b21b6","#c4b5fd"] },
      { code:"B5", deposit:5200000, perTask: 2250, dailyTasks: 80, colors:["#065f46","#86efac"] },
      { code:"B6", deposit:13470000,perTask: 3700, dailyTasks:130, colors:["#7c2d12","#fdba74"] },
      { code:"B7", deposit:30000000,perTask: 6500, dailyTasks:175, colors:["#7f1d1d","#fca5a5"] },
      { code:"B8", deposit:60000000,perTask: 8750, dailyTasks:260, colors:["#075985","#93c5fd"] },
      { code:"B9", deposit:99000000,perTask:15000, dailyTasks:300, colors:["#3730a3","#c7d2fe"] },
    ];

    let currentUser = null;
    let userDoc = null;

    async function loadUser(){
      const uref = doc(db,"users",currentUser.uid);
      const snap = await getDoc(uref);
      userDoc = snap.exists() ? snap.data() : {};

      const bal = fmtUGX(userDoc.mainWallet || 0);
      const currLevel = userDoc.level || "Intern";
      const status = userDoc.levelStatus || (userDoc.pendingLevel ? "under_review" : "—");
      const statusText = userDoc.pendingLevel
        ? `Status: ${status} (${userDoc.pendingLevel})`
        : `Status: ${status}`;

      $("#balancePill").textContent = `Balance: ${bal}`;
      $("#levelPill").textContent   = `Level: ${currLevel}`;
      $("#statusPill").textContent  = statusText;
    }

    function addLevelCard(container, meta, isIntern=false){
      const required = isIntern ? meta.deposit : meta.deposit + 10000; // add 10k to join amount
      const headBg = isIntern ? grad("#6b7280","#9ca3af") : grad(meta.colors[0], meta.colors[1]);

      const wrap = document.createElement("section");
      wrap.className = "level";
      wrap.innerHTML = `
        <div class="lv-head" style="background:${headBg}">
          <div class="lv-name">${isIntern ? "intern" : meta.code}</div>
          <div class="lv-amount">${fmtUGX(required)}</div>
        </div>
        <div class="lv-foot">
          <div class="lv-chip">Each Task: <b>${fmtUGX(meta.perTask)}</b></div>
          <div class="lv-chip">Daily tasks: <b>${meta.dailyTasks}</b></div>
          <div class="spacer"></div>
          <button class="btn"${isIntern ? " disabled" : ""} id="${isIntern ? "internBtn" : "join_"+meta.code}">
            ${isIntern ? "—" : "Join now"}
          </button>
        </div>
      `;
      container.appendChild(wrap);

      if (!isIntern){
        wrap.querySelector(`#join_${meta.code}`).addEventListener("click", ()=>handleJoin(meta, required));
      }
    }

    function render(){
      const list = $("#list");
      list.innerHTML = "";
      // Intern card (display only)
      addLevelCard(list, INTERN, true);
      // B1..B9
      LEVELS.forEach(lv => addLevelCard(list, lv, false));
    }

    async function handleJoin(level, depositRequired){
      const uref = doc(db,"users",currentUser.uid);
      try{
        await runTransaction(db, async (tx)=>{
          const snap = await tx.get(uref);
          const u = snap.exists() ? snap.data() : {};
          const balance = Number(u.mainWallet || 0);
          if (balance < depositRequired){
            throw new Error(`Insufficient balance. Need ${fmtUGX(depositRequired)}, you have ${fmtUGX(balance)}.`);
          }
          tx.set(uref, {
            mainWallet: balance - depositRequired,
            pendingLevel: level.code,
            levelStatus: "under_review",
            pendingLevelDeposit: depositRequired,
            levelRequestedAt: serverTimestamp()
          }, { merge:true });
        });

        showBanner(`Request submitted for ${level.code}. ${fmtUGX(depositRequired)} deducted. Status: under review.`, true);
        await loadUser();
      }catch(e){
        console.error(e);
        showBanner(e.message || "Failed to submit join request.");
      }
    }

    onAuthStateChanged(auth, async (user)=>{
      try{
        if (!user){ location.href = "login.html"; return; }
        currentUser = user;
        await loadUser();
        render();
      }catch(e){
        console.error(e);
        showBanner("Could not load your level data. Please refresh.");
      }finally{
        hideOverlay(); // spinner always disappears
      }
    });
  </script>
</body>
</html>
