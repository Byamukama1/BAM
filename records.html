<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAM • My Records</title>
  <style>
    :root{ --brand:#9b1c1c; --brand-d:#7c1111; --ink:#161617; --muted:#6b7280; }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    body{
      margin:0;color:var(--ink);background:
        radial-gradient(120% 120% at -10% -10%, #fbeceb 0%, transparent 60%),
        radial-gradient(120% 120% at 110% -10%, #f6d8d5 0%, transparent 60%),
        linear-gradient(180deg, #fff 0%, #fbeceb 30%, #f6d8d5 85%, #f2c4bf 100%);
    }
    header{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:14px 16px;font-weight:900}
    .wrap{max-width:1100px;margin:0 auto;padding:14px}
    .muted{color:var(--muted);font-size:12px}
    .card{background:#fff;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.06);padding:12px}

    /* Table (no horizontal scroll) */
    .table-wrap{overflow-x:hidden}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    th,td{padding:8px 10px;border-bottom:1px solid #f1f5f9}
    th{background:#fafafa;font-weight:900;color:#7c1111}
    tr:last-child td{border-bottom:none}
    td{word-wrap:break-word;white-space:normal}

    /* 4 compact columns */
    .col-type{width:22%}
    .col-amt{width:26%}
    .col-date{width:26%}
    .col-status{width:26%}

    .pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:900}
    .p-dep{background:#eef2ff;border:1px solid #c7d2fe}
    .p-wdr{background:#e8fff2;border:1px solid #c3efda}
    .p-fnd{background:#fff6e0;border:1px solid #f3cf69}
    .p-upg{background:#fde7ef;border:1px solid #f8bbd0}
  </style>
</head>
<body>
  <header>BAM • My Records</header>

  <main class="wrap">
    <div class="card table-wrap">
      <table id="recordsTable" aria-label="My records">
        <thead>
          <tr>
            <th class="col-type">Type</th>
            <th class="col-amt">Amount</th>
            <th class="col-date">Date</th>
            <th class="col-status">Status</th>
          </tr>
        </thead>
        <tbody><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
    <p class="muted" style="margin-top:6px">These are your deposits, withdraws, funds, and upgrades. Newest first.</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, collection, getDocs, query, where
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    /* ---------- Firebase ---------- */
    const firebaseConfig = {
      apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
      authDomain: "bam1-3d3e5.firebaseapp.com",
      projectId: "bam1-3d3e5",
      storageBucket: "bam1-3d3e5.firebasestorage.app",
      messagingSenderId: "649603741902",
      appId: "1:649603741902:web:e67f20363f485c0948789f",
      measurementId: "G-W2DY026FXB"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db  = getFirestore(app);

    const $ = id => document.getElementById(id);
    const UGX = n => "UGX " + Number(n||0).toLocaleString("en-UG");
    const tsToMs = (v)=> v?.seconds ? v.seconds*1000 : (typeof v === 'number' ? v : null);
    const fmtDateOnly = (ms)=> new Date(ms||Date.now()).toLocaleDateString(); // date only

    function row(rec){
      const typePill =
        rec.type==='deposit' ? '<span class="pill p-dep">deposit</span>' :
        rec.type==='withdraw' ? '<span class="pill p-wdr">withdraw</span>' :
        rec.type==='fund' ? '<span class="pill p-fnd">fund</span>' :
        '<span class="pill p-upg">upgrade</span>';
      return `
        <tr>
          <td class="col-type">${typePill}</td>
          <td class="col-amt">${UGX(rec.amount||0)}</td>
          <td class="col-date">${fmtDateOnly(rec.dateMs)}</td>
          <td class="col-status">${rec.status || '—'}</td>
        </tr>
      `;
    }

    function render(records){
      const tb = $('recordsTable').querySelector('tbody');
      if (!records.length){
        tb.innerHTML = `<tr><td colspan="4" class="muted">No records.</td></tr>`;
        return;
      }
      tb.innerHTML = records.map(row).join('');
    }

    async function loadMyRecords(uid){
      const results = [];

      // deposits
      const depSnap = await getDocs(query(collection(db,'deposits'), where('uid','==', uid)));
      depSnap.forEach(d=>{
        const v = d.data();
        results.push({
          type:'deposit',
          amount: Number(v.amount||0),
          status: v.status || '',
          dateMs: tsToMs(v.createdAt) ?? v.createdAtMs ?? Date.now()
        });
      });

      // withdraws
      const wSnap = await getDocs(query(collection(db,'withdraws'), where('uid','==', uid)));
      wSnap.forEach(d=>{
        const v = d.data();
        results.push({
          type:'withdraw',
          amount: Number(v.netAmount ?? v.amount ?? 0),
          status: v.status || '',
          dateMs: tsToMs(v.createdAt) ?? v.createdAtMs ?? Date.now()
        });
      });

      // funds
      const fSnap = await getDocs(query(collection(db,'funds'), where('uid','==', uid)));
      fSnap.forEach(d=>{
        const v = d.data();
        results.push({
          type:'fund',
          amount: Number(v.amount||0),
          status: v.status || '',
          dateMs: tsToMs(v.createdAt) ?? v.createdAtMs ?? Date.now()
        });
      });

      // upgrades
      const uSnap = await getDocs(query(collection(db,'upgrades'), where('uid','==', uid)));
      uSnap.forEach(d=>{
        const v = d.data();
        const status = v.toLevel ? `to ${v.toLevel}` : 'upgrade';
        results.push({
          type:'upgrade',
          amount: Number(v.newAmountPaid || 0),
          status,
          dateMs: tsToMs(v.createdAt) ?? Date.now()
        });
      });

      // newest first
      results.sort((a,b)=> b.dateMs - a.dateMs);
      render(results);
    }

    onAuthStateChanged(auth, (user)=>{
      if (!user){ location.href = 'login.html'; return; }
      loadMyRecords(user.uid);
    });
  </script>
</body>
</html>
