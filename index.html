<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAM • Home</title>
  <style>
    :root{
      --brand-red:#9b1c1c;
      --brand-red-d:#7c1111;
      --brand-gold:#fbbf24;

      --rose-25:#fbeceb;
      --rose-50:#f6d8d5;
      --rose-75:#f2c4bf;

      --ink:#161617;
      --muted:#6b7280;
    }

    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    body{
      margin:0;color:var(--ink);
      background:
        radial-gradient(120% 120% at -10% -10%, var(--rose-25) 0%, transparent 60%),
        radial-gradient(120% 120% at 110% -10%, var(--rose-50) 0%, transparent 60%),
        linear-gradient(180deg, #fff 0%, var(--rose-25) 30%, var(--rose-50) 85%, var(--rose-75) 100%);
    }
    .wrap{max-width:1100px;margin:0 auto;padding:0 14px 92px}

    /* Loader overlay */
    .loader{
      position:fixed;inset:0;display:grid;place-items:center;
      background:rgba(255,255,255,.9);backdrop-filter:blur(4px);
      z-index:9999;
    }
    .spinner{
      width:52px;height:52px;border-radius:50%;
      border:5px solid #f3d1d1;border-top-color:var(--brand-red);
      animation:spin 0.9s linear infinite;margin:0 auto 10px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .welcome{color:var(--brand-red-d);font-weight:800}

    /* Top bar */
    .top{
      background:linear-gradient(135deg,var(--brand-red),var(--brand-red-d));
      color:#fff;padding:14px 16px;
      display:flex;align-items:center;justify-content:space-between
    }
    .brand{font-weight:800;letter-spacing:.3px}
    .brand small{font-weight:500;opacity:.9}
    .bell{background:rgba(255,255,255,.16);border:none;color:#fff;padding:8px 10px;border-radius:10px}

    /* Announcements */
    .slider{margin-top:12px;border-radius:18px;overflow:hidden}
    .rail{
      display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;
      scrollbar-width:none;-ms-overflow-style:none;
      scroll-behavior:smooth;
    }
    .rail::-webkit-scrollbar{display:none}
    .slide{min-width:100%;max-width:100%;scroll-snap-align:start;position:relative;height:210px;background:#ead5d3;flex:0 0 auto}
    .slide img{width:100%;height:100%;object-fit:cover;display:block}
    .slide .caption{
      position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));color:#fff;font-size:13px
    }
    @media (min-width:900px){ .slide{height:260px} }

    /* Compact circular buttons */
    .grid-small{
      margin:16px 0 6px; display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px 6px; justify-items:center;
    }
    .btn{text-align:center;text-decoration:none;color:var(--ink);font-size:11px;font-weight:600;line-height:1.1}
    .ico-small{
      width:46px;height:46px;border-radius:50%;
      background:linear-gradient(135deg,#fff,#fff4d2);
      display:grid;place-items:center;margin:0 auto 6px;
      font-size:18px;color:var(--brand-red-d);
      box-shadow:inset 0 0 0 2px rgba(155,28,28,.28), 0 2px 6px rgba(155,28,28,.12);
    }
    .btn span{display:block;font-size:11px;color:var(--brand-red-d);font-weight:700}

    /* Section title */
    .section{margin-top:10px}
    .section h3{margin:0 0 6px 4px;font-size:14px;font-weight:800;color:var(--brand-red-d)}

    /* Activity list with auto-scroll */
    .list-wrap{
      height:190px; overflow:hidden; border-radius:16px; background:rgba(255,255,255,.7);
    }
    .list{padding:6px 6px 0 6px}
    .item{
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 8px;margin:0 0 6px;border-radius:12px;background:rgba(255,255,255,.72)
    }
    .meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px}
    .type{
      padding:3px 8px;border-radius:999px;background:#fff5d6;font-size:11px;
      color:var(--brand-red-d);box-shadow:inset 0 0 0 1px rgba(251,191,36,.85)
    }
    .amount{font-weight:800;color:#0b5d2c;font-size:13px}
    .muted{color:var(--muted)}

    /* Bottom nav (no yellow line) */
    .nav{
      position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
      display:flex;justify-content:space-around;padding:10px 8px 12px;z-index:10;backdrop-filter:blur(4px);
      box-shadow:0 -6px 20px rgba(0,0,0,.06);
    }
    .nav a{
      flex:1;text-align:center;text-decoration:none;color:#6b4a4a;
      font-size:12px;padding:6px 0;border-radius:16px;margin:0 4px;transition:.15s
    }
    .nav a.active{
      color:#fff;background:var(--brand-red);
      box-shadow:0 6px 16px rgba(155,28,28,.25);
      font-weight:800
    }
    .nav .n-ico{display:block;font-size:20px;margin-bottom:4px}
  </style>
</head>
<body>
  <!-- Loader -->
  <div id="loader" class="loader" aria-live="polite" aria-busy="true">
    <div>
      <div class="spinner"></div>
      <div class="welcome">BAM welcomes you back</div>
    </div>
  </div>

  <header class="top">
    <div class="brand">
      <div>BAM</div>
      <small>Business Advertising & Marketing</small>
    </div>
    
<button 
  onclick="window.open('https://chat.whatsapp.com/GMqVXBsyzTKHZGsmV12tMH?mode=ems_copy_t', '_blank')" 
  style="
    background:linear-gradient(135deg,#9b1c1c,#7c1111);
    color:#fff;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:40px;
    padding:4px 10px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
    transition:all 0.25s ease-in-out;
    margin:0;
  "
  onmouseover="this.style.background='linear-gradient(135deg,#b32020,#991010)'; this.style.transform='scale(1.05)';"
  onmouseout="this.style.background='linear-gradient(135deg,#9b1c1c,#7c1111)'; this.style.transform='scale(1)';"
>
  <small>💬 Join Group</small>
</button>

  </header>

  <main class="wrap">

    <!-- Announcements -->
    <section class="slider">
      <div id="sliderRail" class="rail"></div>
    </section>

    <!-- Compact Buttons: 3 per row -->
    <section class="grid-small" aria-label="Quick actions">
      <a class="btn" href="recharge.html"><div class="ico-small">💳</div><span>Recharge</span></a>
      <a class="btn" href="withdraw.html"><div class="ico-small">💸</div><span>Withdraw</span></a>
      <a class="btn" href="companyProfile.html"><div class="ico-small">🏢</div><span>Company</span></a>

      <a class="btn" href="invite.html"><div class="ico-small">🤝</div><span>Invite</span></a>
      <a class="btn" href="tasks.html"><div class="ico-small">🗂️</div><span>Tasks</span></a>
      <a class="btn" href="help.html"><div class="ico-small">🆘</div><span>Help</span></a>

      <a class="btn" href="luckySpin.html"><div class="ico-small">🎡</div><span>Lucky</span></a>
      <a class="btn" href="fund.html"><div class="ico-small">💰</div><span>Fund</span></a>
      <a class="btn" href="records.html"><div class="ico-small">📒</div><span>Records</span></a>
    </section>

    <!-- Mixed Activity (auto-scroll) -->
    <section class="section">
      <h3>Recent Wallet Activity</h3>
      <div class="list-wrap">
        <div id="activityList" class="list"></div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="nav">
    <a class="active" href="index.html" aria-current="page"><span class="n-ico">🏠</span>Home</a>
    <a href="tasks.html"><span class="n-ico">🗂️</span>Tasks</a>
    <a href="levels.html"><span class="n-ico">🎖️</span>Levels</a>
    <a href="profit.html"><span class="n-ico">💹</span>Profit</a>

  <!-- Firebase (ESM) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
    import {
      getFirestore, collection, query, orderBy, limit, getDocs, where
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
      authDomain: "bam1-3d3e5.firebaseapp.com",
      projectId: "bam1-3d3e5",
      storageBucket: "bam1-3d3e5.firebasestorage.app",
      messagingSenderId: "649603741902",
      appId: "1:649603741902:web:e67f20363f485c0948789f",
      measurementId: "G-W2DY026FXB"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const db = getFirestore(app);

    const $ = (id)=>document.getElementById(id);
    const loader = $("loader");

    function maskPhone(phone){
      if (!phone) return "***********";
      const s = String(phone);
      return s.slice(0,4) + "****" + s.slice(-3);
    }
    function formatUGX(amount){ return "UGX " + Number(amount||0).toLocaleString("en-UG"); }
    function tsToMs(v){
      if (!v) return 0;
      if (typeof v === "number") return v;
      if (v.toDate) return v.toDate().getTime();
      if (v.seconds) return v.seconds*1000 + (v.nanoseconds||0)/1e6;
      return Date.parse(v) || 0;
    }
    function parseAmount(amt){ const n = Number(amt); return isNaN(n) ? 0 : n; }
    function renderEmpty(el, text){
      el.innerHTML = `<div class="item" style="background:rgba(255,255,255,.6);text-align:center">${text}</div>`;
    }

    // ---- Announcements ----
    async function loadAnnouncements(){
      const rail = $("sliderRail");
      rail.innerHTML = "";
      try{
        const qy = query(collection(db,"announcements"), orderBy("createdAt","desc"), limit(12));
        const snap = await getDocs(qy);
        if (snap.empty){
          rail.innerHTML = `<div class="slide"><div class="caption">No announcements yet</div></div>`;
          return;
        }
        snap.forEach(docSnap=>{
          const a = docSnap.data();
          const img = a.imageUrl || "";
          const title = a.title || "";
          const link = a.linkUrl || "";
          const card = document.createElement(link ? "a" : "div");
          if (link){ card.href = link; card.target = "_blank"; card.rel="noopener"; }
          card.className = "slide";
          card.innerHTML = `${img?`<img src="${img}" alt="announcement">`:""}${title?`<div class="caption">${title}</div>`:""}`;
          rail.appendChild(card);
        });

        // Start horizontal auto-slide (2s per slide)
        startSliderAuto(rail, 2000);

      }catch(e){
        console.error("Announcements error:", e);
        rail.innerHTML = `<div class="slide"><div class="caption">Could not load announcements</div></div>`;
      }
    }

    // Auto slideshow for the horizontal rail
    function startSliderAuto(rail, interval=2000){
      const slides = Array.from(rail.children);
      if (slides.length <= 1) return;

      let idx = 0;
      let paused = false;

      const getWidth = () => rail.clientWidth;
      const goTo = (i) => {
        idx = i % slides.length;
        rail.scrollTo({ left: idx * getWidth(), behavior: "smooth" });
      };

      let timer = setInterval(()=>{ if(!paused) goTo(idx+1); }, interval);

      const pause = () => { paused = true; };
      const resumeSoon = () => { paused = false; };
      const resetTimer = () => { clearInterval(timer); timer = setInterval(()=>{ if(!paused) goTo(idx+1); }, interval); };

      ["pointerdown","mouseenter","touchstart"].forEach(evt => rail.addEventListener(evt, pause, {passive:true}));
      ["pointerup","mouseleave","touchend","touchcancel"].forEach(evt => rail.addEventListener(evt, ()=>setTimeout(resumeSoon, 1500), {passive:true}));

      rail.addEventListener("scroll", ()=>{
        clearTimeout(rail._snapTimer);
        rail._snapTimer = setTimeout(()=>{
          idx = Math.round(rail.scrollLeft / getWidth());
        }, 150);
      });

      window.addEventListener("resize", resetTimer);
    }

    // ---- Wallet Activity: deposits(successful) + withdraws(paid) ----
    async function loadActivity(){
      const box = $("activityList");
      box.innerHTML = "";
      try{
        const [depSnap, wdSnap] = await Promise.all([
          getDocs(
            query(
              collection(db,"deposits"),
              where("status","==","successful"),
              orderBy("createdAt","desc"),
              limit(30)
            )
          ),
          getDocs(
            query(
              collection(db,"withdraws"),
              where("status","==","paid"),
              orderBy("createdAt","desc"),
              limit(30)
            )
          )
        ]);

        const rows = [];

        depSnap.forEach(d=>{
          const r = d.data();
          rows.push({
            type:"Deposit",
            phone:maskPhone(r.phone),
            amount:parseAmount(r.amount),
            amountStr:formatUGX(r.amount),
            at:tsToMs(r.createdAt || r.creditedAt),
            text:`🎉 Congratulations! Recharged ${formatUGX(r.amount)}`
          });
        });

        wdSnap.forEach(d=>{
          const r = d.data();
          rows.push({
            type:"Withdraw",
            phone:maskPhone(r.methodPhone || r.phone || ""),
            amount:parseAmount(r.amount),
            amountStr:formatUGX(r.amount),
            at:tsToMs(r.createdAt || r.paidAt),
            text:`💸 Withdrawal ${formatUGX(r.amount)} — Paid`
          });
        });

        if (!rows.length){ renderEmpty(box,"No wallet activity yet."); return; }

        rows
          .sort((a,b)=> b.amount - a.amount || b.at - a.at)
          .slice(0,20)
          .forEach(r=>{
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
              <div>
                <div class="amount">${r.text}</div>
                <div class="meta"><span class="type">${r.type}</span><span class="muted">${new Date(r.at).toLocaleString()}</span></div>
              </div>
              <div class="type">${r.phone}</div>
            `;
            box.appendChild(div);
          });

        // Start vertical auto-scroll
        startAutoScroll(document.querySelector(".list-wrap"), 35);

      }catch(e){
        console.error("Activity error:", e);
        renderEmpty(box, "Unable to load activity.");
      }
    }

    // Simple vertical auto-scroll (loops)
    function startAutoScroll(container, speedMs=40){
      if (!container) return;
      const list = container.querySelector(".list");
      if (!list) return;

      const clone = list.cloneNode(true);
      container.appendChild(clone);

      let y = 0;
      const step = () => {
        y += 1;
        if (y >= list.scrollHeight) y = 0;
        container.scrollTop = y;
      };
      setInterval(step, speedMs);
    }

    // ---- Init + Loader hide ----
    await Promise.all([loadAnnouncements(), loadActivity()]);
    setTimeout(()=>{ loader.style.display = "none"; loader.setAttribute("aria-busy","false"); }, 600);
  </script>
</body>
</html>
