<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BAM • Team Report</title>
  <style>
    :root{
      --brand:#9b1c1c; --brand2:#7c1111; --gold:#fbbf24; --ink:#161617;
      --muted:#6b7280; --bd:#efe2e2; --bg:#fff7f7; --card:#ffffff;
    }
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{margin:0;background:var(--bg);color:var(--ink)}
    header{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;padding:16px 18px;font-weight:900;letter-spacing:.2px
    }
    .wrap{max-width:1000px;margin:0 auto;padding:16px 14px}
    .card{background:var(--card);border-radius:16px;border:1px solid var(--bd);
      box-shadow:0 10px 24px rgba(0,0,0,.06);padding:14px;margin-bottom:14px}

    /* Summary table */
    .tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
    .tbl thead th{
      font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
      text-align:left;padding:10px 12px
    }
    .tbl tbody td{
      background:#fff;border:1px solid var(--bd);padding:12px;border-radius:12px
    }

    /* List table */
    .list{
      width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--bd);
      border-radius:12px;overflow:hidden
    }
    .list thead th{
      background:#fcf1f1;color:#733;border-bottom:1px solid var(--bd);
      font-size:12px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:12px
    }
    .list tbody tr{background:#fff}
    .list tbody tr:nth-child(odd){background:#fffdfd}
    .list tbody td{padding:12px;border-bottom:1px solid #f3e3e3}
    .list tbody tr:last-child td{border-bottom:none}

    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{display:inline-block;background:#fff5d6;border:1px solid #f3c74d;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
    .btn{appearance:none;border:none;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}
    .btn.tab{background:#f6f7f9;border:1px solid #e6e8eb}
    .btn.tab.active{background:var(--gold);color:#111;border-color:#fbd34d}
    .search{flex:1;min-width:220px;border:1px solid #e6e8eb;border-radius:10px;padding:10px 12px;font-weight:600}
    .right{margin-left:auto}
    .small{font-size:12px;color:var(--muted)}

    .badge{
      display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;border:1px solid
    }
    .badge.v{background:#ecfff3;border-color:#b8f0cd;color:#0b6d3a}
    .badge.i{background:#f3f4f6;border-color:#e5e7eb;color:#374151}

    .empty{padding:20px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
<header>Team Report</header>

<main class="wrap">
  <!-- Summary -->
  <section class="card">
    <div class="row" style="margin-bottom:6px">
      <span class="small">Team counts refresh on load or when you click refresh.</span>
      <button id="refreshBtn" class="btn tab right">Refresh</button>
    </div>

    <table class="tbl" aria-label="Referral summary">
      <thead>
        <tr>
          <th>Level</th>
          <th>Total</th>
          <th>Verified</th>
          <th>Interns</th>
        </tr>
      </thead>
      <tbody>
        <tr><td><b>Level A</b></td><td id="a_total">—</td><td id="a_ver">—</td><td id="a_int">—</td></tr>
        <tr><td><b>Level B</b></td><td id="b_total">—</td><td id="b_ver">—</td><td id="b_int">—</td></tr>
        <tr><td><b>Level C</b></td><td id="c_total">—</td><td id="c_ver">—</td><td id="c_int">—</td></tr>
      </tbody>
    </table>
  </section>

  <!-- Lists -->
  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <button class="btn tab active" data-tier="A">Level A</button>
      <button class="btn tab" data-tier="B">Level B</button>
      <button class="btn tab" data-tier="C">Level C</button>
      <input id="searchBox" class="search" placeholder="Search name, email or phone…" />
      <span class="small" id="rowCount"></span>
    </div>

    <table class="list" aria-label="Invited friends">
      <thead>
        <tr>
          <th style="width:44%">Name</th>
          <th style="width:32%">Phone</th>
          <th style="width:24%">Status</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="3" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  /* Firebase Config */
  const firebaseConfig = {
    apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
    authDomain: "bam1-3d3e5.firebaseapp.com",
    projectId: "bam1-3d3e5",
    storageBucket: "bam1-3d3e5.firebasestorage.app",
    messagingSenderId: "649603741902",
    appId: "1:649603741902:web:e67f20363f485c0948789f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);
  const LEVELS = ["B9","B8","B7","B6","B5","B4","B3","B2","B1"]; // rank order

  function highestVerified(u){
    for(const lvl of LEVELS){ if(u?.[lvl]?.status==="verified") return lvl; }
    return null;
  }
  function badge(u){
    const v = highestVerified(u);
    return v
      ? `<span class="badge v">${v}</span>`
      : `<span class="badge i">Intern</span>`;
  }

  const dataSets = {A:[],B:[],C:[]};

  async function loadTier(uid,tier){
    let q;
    if(tier==="A") q=query(collection(db,"users"),where("refA_uid","==",uid));
    if(tier==="B") q=query(collection(db,"users"),where("refB_uid","==",uid));
    if(tier==="C") q=query(collection(db,"users"),where("refC_uid","==",uid));

    const snap=await getDocs(q);
    const arr=[];
    snap.forEach(d=>arr.push({id:d.id,...d.data()}));

    // Sort: verified levels first
    arr.sort((a,b)=>{
      const av = highestVerified(a)?1:0;
      const bv = highestVerified(b)?1:0;
      return bv - av;
    });
    dataSets[tier]=arr;
  }

  function summarize(tier){
    const list=dataSets[tier]||[];
    const total=list.length;
    const verified=list.filter(u=>highestVerified(u)).length;
    const interns=total-verified;
    $(`${tier.toLowerCase()}_total`).textContent=total;
    $(`${tier.toLowerCase()}_ver`).textContent=verified;
    $(`${tier.toLowerCase()}_int`).textContent=interns;
  }

  function renderList(tier){
    const arr=dataSets[tier]||[];
    const q=$("searchBox").value.trim().toLowerCase();
    const filtered=q?arr.filter(u=>{
      const t=`${u.name||""} ${u.email||""} ${u.phone||""}`.toLowerCase();
      return t.includes(q);
    }):arr;

    $("rows").innerHTML = filtered.length
      ? filtered.map(u=>`
        <tr>
          <td>${u.name||"—"}</td>
          <td>${u.phone||"—"}</td>
          <td>${badge(u)}</td>
        </tr>`).join("")
      : `<tr><td colspan="3" class="empty">No results found.</td></tr>`;

    $("rowCount").textContent = `${filtered.length} shown`;
  }

  async function loadAll(uid){
    await loadTier(uid,"A");
    await loadTier(uid,"B");
    await loadTier(uid,"C");
    summarize("A"); summarize("B"); summarize("C");
    renderList("A");
  }

  document.querySelectorAll(".btn.tab").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".btn.tab").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      renderList(btn.dataset.tier);
    });
  });

  $("searchBox").addEventListener("input",()=>{
    const active=document.querySelector(".btn.tab.active")?.dataset.tier||"A";
    renderList(active);
  });

  $("refreshBtn").addEventListener("click",async()=>{
    const u=auth.currentUser;
    if(u) await loadAll(u.uid);
  });

  onAuthStateChanged(auth, async user=>{
    if(!user){ location.href="login.html"; return; }
    const usnap=await getDoc(doc(db,"users",user.uid));
    if(!usnap.exists()){ location.href="register.html"; return; }
    await loadAll(user.uid);
  });
</script>
</body>
</html>
