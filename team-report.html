<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BAM • Register</title>
  <style>
    :root{ --brand-red:#9b1c1c; --brand-gold:#fbbf24; --muted:#6b7280 }
    *{ box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif }
    body{ margin:0; background:#fafafa; color:#111; display:grid; place-items:center; min-height:100vh; padding:16px }
    .card{ width:100%; max-width:520px; background:#fff; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.08); overflow:hidden; border:1px solid #eee }
    .header{ background:linear-gradient(135deg,var(--brand-red),#7c1111); color:#fff; padding:22px 20px }
    .header h1{ margin:0; font-size:22px }
    .subtitle{ opacity:.9; margin-top:6px; font-size:13px }
    form{ padding:20px }
    label{ display:block; font-size:13px; margin:14px 0 6px }
    input{ width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:10px; font-size:15px; outline:none; transition:.2s }
    input:focus{ border-color:var(--brand-red); box-shadow:0 0 0 3px rgba(155,28,28,.12) }
    .row{ display:flex; gap:10px }
    .row>div{ flex:1 }
    .muted{ font-size:12px; color:#6b7280; line-height:1.4 }
    .btn{ margin-top:16px; width:100%; padding:12px 14px; border:none; border-radius:12px; background:var(--brand-gold); color:#111; font-weight:700; font-size:16px; cursor:pointer }
    .btn:hover{ filter:brightness(.98) }
    .alt{ padding:14px 20px; background:#fff; border-top:1px solid #eee; font-size:14px }
    .alt a{ color:#9b1c1c; text-decoration:none; font-weight:600 }
    .error{ background:#ffe8e8; color:#7c1111; border:1px solid #f2c4c4; padding:10px 12px; border-radius:10px; margin-top:10px; font-size:13px; display:none }
    .ok{ background:#e8fff2; color:#0b6d3a; border:1px solid #c3efda; padding:10px 12px; border-radius:10px; margin-top:10px; font-size:13px; display:none }
    .chip{ display:inline-block; margin-top:8px; background:#fff5d6; border:1px solid #f3c74d; color:#7c1111; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700 }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Create your BAM account</h1>
      <div class="subtitle">Business Advertising & Marketing</div>
    </div>

    <form id="regForm" autocomplete="on">
      <label for="name">Full Name</label>
      <input id="name" type="text" required placeholder="write your name" />

      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@gmail.com" />

      <label for="phone">Phone</label>
      <input id="phone" type="tel" required placeholder="2567xxxxxxxx" />

      <div class="row">
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" minlength="6" required placeholder="••••••••" />
        </div>
        <div>
          <label for="confirm">Confirm Password</label>
          <input id="confirm" type="password" minlength="6" required placeholder="••••••••" />
        </div>
      </div>

      <div id="refChip" class="chip" style="display:none"></div>

      <p class="muted">
        Note down your password to keep remembering it. Press create account after filling in all the required information.
      </p>

      <div class="error" id="err"></div>
      <div class="ok" id="ok"></div>

      <button class="btn" type="submit">Create Account</button>
    </form>

    <div class="alt">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, query, where, getDocs, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    /* Firebase config */
    const firebaseConfig = {
      apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
      authDomain: "bam1-3d3e5.firebaseapp.com",
      projectId: "bam1-3d3e5",
      storageBucket: "bam1-3d3e5.firebasestorage.app",
      messagingSenderId: "649603741902",
      appId: "1:649603741902:web:e67f20363f485c0948789f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const usersCol = collection(db,"users");
    const $ = id=>document.getElementById(id);
    const errBox=$("err"), okBox=$("ok"), refChip=$("refChip");

    function showError(m){errBox.style.display="block";errBox.textContent=m;okBox.style.display="none";}
    function showOk(m){okBox.style.display="block";okBox.textContent=m;errBox.style.display="none";}

    function normalizeUGPhone(raw){
      if(!raw)return null;
      let s=(""+raw).trim().replace(/\D/g,"");
      if(s.startsWith("0")&&s.length===10)return"256"+s.slice(1);
      if(s.startsWith("256")&&s.length===12)return s;
      if(s.length===9&&s.startsWith("7"))return"256"+s;
      return null;
    }

    async function findUserByInvite(code){
      if(!code)return null;
      const snap=await getDocs(query(usersCol,where("inviteCode","==",code.toUpperCase())));
      if(snap.empty)return null;
      const d=snap.docs[0];
      return {uid:d.id,...d.data()};
    }

    async function generateUniqueInviteCode(){
      const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      while(true){
        const code=Array.from({length:6},()=>alphabet[Math.floor(Math.random()*alphabet.length)]).join("");
        const snap=await getDocs(query(usersCol,where("inviteCode","==",code)));
        if(snap.empty)return code;
      }
    }

    /* 🔗 Smart chain resolver */
    async function resolveReferrers(){
      const p=new URLSearchParams(location.search);
      const codeA=(p.get("inviteCode")||p.get("ref")||p.get("a")||"").toUpperCase();
      if(!codeA)return {refA:null,refB:null,refC:null,refA_uid:null,refB_uid:null,refC_uid:null};

      const aUser=await findUserByInvite(codeA);
      if(!aUser)return {refA:null,refB:null,refC:null,refA_uid:null,refB_uid:null,refC_uid:null};

      let refA=codeA, refA_uid=aUser.uid;
      let refB=aUser.refA||null, refB_uid=aUser.refA_uid||null;
      let refC=null, refC_uid=null;

      // if refB exists, find its parent to form third tier
      if(refB){
        const bUser=await findUserByInvite(refB);
        if(bUser){ refC=bUser.refA||null; refC_uid=bUser.refA_uid||null; }
      }

      refChip.style.display="inline-block";
      refChip.textContent=`Referral chain → A:${refA||"-"} B:${refB||"-"} C:${refC||"-"}`;

      return {refA,refB,refC,refA_uid,refB_uid,refC_uid};
    }

    $("regForm").addEventListener("submit",async e=>{
      e.preventDefault();
      errBox.style.display="none";okBox.style.display="none";

      const name=$("name").value.trim();
      const email=$("email").value.trim().toLowerCase();
      const phone=normalizeUGPhone($("phone").value.trim());
      const pass=$("password").value;
      const confirm=$("confirm").value;

      if(!name)return showError("Please enter your full name.");
      if(!email)return showError("Please enter a valid email.");
      if(!phone)return showError("Please enter a valid Ugandan phone number.");
      if(pass.length<6)return showError("Password must be at least 6 characters.");
      if(pass!==confirm)return showError("Passwords do not match.");

      const refs=await resolveReferrers();
      const myInvite=await generateUniqueInviteCode();

      try{
        const cred=await createUserWithEmailAndPassword(auth,email,pass);
        await updateProfile(cred.user,{displayName:name});
        const uid=cred.user.uid;

        await setDoc(doc(db,"users",uid),{
          uid,name,email,phone,
          role:"member",
          inviteCode:myInvite,
          refA:refs.refA||null,
          refA_uid:refs.refA_uid||null,
          refB:refs.refB||null,
          refB_uid:refs.refB_uid||null,
          refC:refs.refC||null,
          refC_uid:refs.refC_uid||null,
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp(),
          referralCountA:0,referralCountB:0,referralCountC:0,
          totalEarnings:0,mainWallet:0,commissionWallet:0
        });

        showOk("Account created successfully! Redirecting…");
        setTimeout(()=>location.href="index.html",700);
      }catch(err){
        console.error(err);
        let msg="Sign up failed. ";
        if(err.code==="auth/email-already-in-use")msg+="This email is already registered.";
        else if(err.code==="auth/invalid-email")msg+="Invalid email.";
        else if(err.code==="auth/weak-password")msg+="Password too weak.";
        else msg+="Please try again.";
        showError(msg);
      }
    });

    // visual hint if link has ?inviteCode=
    (()=>{const p=new URLSearchParams(location.search);const c=(p.get("inviteCode")||p.get("ref")||"").toUpperCase();if(c){refChip.style.display="inline-block";refChip.textContent=`Using referral code: ${c}`;}})();
  </script>
</body>
</html>
