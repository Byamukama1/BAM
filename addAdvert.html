<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BAM • Upload Advert</title>
  <style>
    :root{--brand:#9b1c1c;--gold:#fbbf24;--ink:#161617}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;background:#fff7f7;color:#111}
    header{background:#9b1c1c;color:#fff;padding:14px;text-align:center;font-weight:800;letter-spacing:.2px}
    .wrap{max-width:760px;margin:0 auto;padding:16px}
    .card{background:#fff;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
    /* Compact table */
    .tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
    .tbl th,.tbl td{padding:10px 12px}
    .tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#5b5b5b}
    .roww{background:#fff;border:1px solid #f0d4d4;border-radius:10px}
    .tbl td:first-child{font-weight:800;color:#7a2e2e;white-space:nowrap;width:1%}
    .tbl td:nth-child(2){white-space:nowrap;width:1%}
    .tbl td:nth-child(3){white-space:nowrap;width:1%}
    .tbl td:nth-child(4){white-space:nowrap;width:1%}
    .note{font-size:12px;color:#6b7280;margin-top:8px}
    label{display:block;font-weight:700;font-size:13px;margin:10px 0 6px;color:#502a2a}
    input,textarea{width:100%;padding:10px;border:1px solid #e3c4c4;border-radius:10px;font-size:14px;outline:none;background:#fff}
    textarea{min-height:64px;resize:vertical}
    input:focus,textarea:focus{border-color:#9b1c1c;box-shadow:0 0 0 3px rgba(155,28,28,.12)}
    .btn{margin-top:14px;display:block;width:100%;padding:12px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;background:#fbbf24;color:#111}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .preview{margin-top:12px;display:grid;place-items:center;border:1px dashed #e5b7b7;border-radius:12px;min-height:160px;background:#fff}
    video{max-width:100%;border-radius:10px}
    .progress{height:8px;background:#fde68a;border-radius:999px;overflow:hidden;margin-top:10px;display:none}
    .bar{height:100%;width:0;background:linear-gradient(90deg,#fbbf24,#ffd04a)}
    .status{margin-top:10px;font-size:13px}
    .ok{color:#0b6d3a}.err{color:#7c1111}
    .pill{display:inline-block;background:#fff5d6;border:1px solid #f3c74d;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:8px}
  </style>
</head>
<body>
  <header><blockquote>
    
  </blockquote> Upload Advert</header>
  <main class="wrap">

    <!-- Conditions table -->
    <section class="card">
      <table class="tbl" aria-label="Upload Conditions">
        <thead>
          <tr>
            <th>Condition</th>
            <th>Amount</th>
            <th>No. of videos</th>
            <th>For how long</th>
          </tr>
        </thead>
        <tbody>
          <tr class="roww">
            <td>Verified</td>
            <td>UGX 0</td>
            <td>5 videos</td>
            <td>5 years</td>
          </tr>
          <tr class="roww">
            <td>Not verified</td>
            <td>UGX 10,000</td>
            <td>2 videos</td>
            <td>5 years</td>
          </tr>
        </tbody>
      </table>
      <div class="note">
        Tip: Please upload videos in <b>landscape (16:9)</b> for the best visibility on the Tasks page.
        if taking videos hold phone in landscape
      </div>
      <div id="whoAmI" class="note"></div>
    </section>

    <!-- Uploader -->
    <section class="card">
      <label for="title">Title (max 5 words)</label>
      <input id="title" type="text" placeholder="Enter advert title" maxlength="40" />

      <label for="desc">Description (max 50 words)</label>
      <textarea id="desc" placeholder="Enter description of the advert (≤ 50 words)" maxlength="250"></textarea>

      <label for="file">Pick Video</label>
      <input id="file" type="file" accept="video/*" />
      <div class="preview" id="preview"><span class="note">No file selected</span></div>

      <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
      <div class="status" id="status"></div>

      <button class="btn" id="uploadBtn">Upload advert</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, runTransaction, query, where, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    /* ---------------- Firebase ---------------- */
    const firebaseConfig = {
      apiKey: "AIzaSyB1pL0R6K7haTKKKdtcWA_9LTvagLcOwlM",
      authDomain: "bam1-3d3e5.firebaseapp.com",
      projectId: "bam1-3d3e5",
      storageBucket: "bam1-3d3e5.firebasestorage.app",
      messagingSenderId: "649603741902",
      appId: "1:649603741902:web:e67f20363f485c0948789f"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ---------------- Cloudinary (unsigned) ---------------- */
    const cloudinaryConfig = { cloudName: "dp81zzxlh", uploadPreset: "Unsigned upload" };
    const CLOUD_URL = `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/video/upload`;

    /* ---------------- Helpers ---------------- */
    const $ = id => document.getElementById(id);
    const fileInput = $("file"), preview = $("preview"), bar = $("bar"),
          progress = $("progress"), statusEl = $("status"), whoEl = $("whoAmI");

    function setProgress(p){ progress.style.display="block"; bar.style.width=Math.max(0,Math.min(100,p))+"%"; }
    function resetProgress(){ progress.style.display="none"; bar.style.width="0%"; }
    function say(msg, ok=false){ statusEl.textContent = msg; statusEl.className = "status " + (ok ? "ok" : "err"); }
    function words(s){ return String(s||"").trim().split(/\s+/).filter(Boolean).length; }

    function uploadToCloudinary(file){
      return new Promise((resolve,reject)=>{
        const fd=new FormData();
        fd.append("file",file);
        fd.append("upload_preset",cloudinaryConfig.uploadPreset);
        const xhr=new XMLHttpRequest();
        xhr.open("POST", CLOUD_URL);
        xhr.upload.addEventListener("progress", e=>{
          if(e.lengthComputable) setProgress((e.loaded/e.total)*100);
        });
        xhr.onreadystatechange=()=>{
          if(xhr.readyState===4){
            resetProgress();
            if(xhr.status>=200 && xhr.status<300){
              try{ resolve(JSON.parse(xhr.responseText)); }
              catch(err){ reject(err); }
            }else reject(new Error("Upload failed"));
          }
        };
        xhr.send(fd);
      });
    }

    function userVerified(u){
      // Any B1..B9 map with status "verified" counts as verified
      const levels = ["B9","B8","B7","B6","B5","B4","B3","B2","B1"];
      return levels.some(k => u?.[k]?.status === "verified");
    }

    let me = null, isVerified = false, uid = null;

    // show selected video
    let pickedFile = null;
    fileInput.addEventListener("change", e=>{
      preview.innerHTML="";
      const f = e.target.files?.[0];
      if(!f){ preview.innerHTML = '<span class="note">No file selected</span>'; return; }
      pickedFile = f;
      const url = URL.createObjectURL(f);
      const v = document.createElement("video");
      v.src = url; v.controls = true; v.muted = true; v.playsInline = true;
      preview.appendChild(v);
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html"; return; }
      uid = user.uid;

      // Load user profile
      const uref = doc(db,"users",uid);
      const usnap = await getDoc(uref);
      me = usnap.exists() ? usnap.data() : {};
      isVerified = userVerified(me);

      whoEl.innerHTML = `Status: <b>${isVerified ? "Verified" : "Not verified"}</b>` +
        (isVerified ? `<span class="pill">Free (up to 5 videos)</span>` : `<span class="pill">UGX 10,000 (up to 2 videos)</span>`);
    });

    async function countMyPending(){
      const qy = query(collection(db,"pendingAdverts"), where("uid","==", uid));
      const snap = await getDocs(qy);
      return snap.size || 0;
    }

    $("uploadBtn").addEventListener("click", async ()=>{
      if(!uid){ say("Please sign in again."); return; }

      const title = $("title").value.trim();
      const desc  = $("desc").value.trim();

      if(!title || words(title) > 5){ say("Title must be present and ≤ 5 words."); return; }
      if(!desc  || words(desc)  > 50){ say("Description must be present and ≤ 50 words."); return; }
      if(!pickedFile){ say("Pick a video file first."); return; }

      // Limits & fee
      const maxVideos = isVerified ? 5 : 2;
      const fee = isVerified ? 0 : 10000;

      try{
        // Enforce count
        const current = await countMyPending();
        if(current >= maxVideos){
          say(`Limit reached: you can have up to ${maxVideos} video${maxVideos>1?"s":""}.`); return;
        }

        say("Uploading video…");
        const up = await uploadToCloudinary(pickedFile);
        const url = up.secure_url || up.url;
        if(!url) throw new Error("No URL returned by Cloudinary.");

        // Save to pendingAdverts + (if needed) deduct from mainWallet in a single transaction
        const expiresAt = new Date(Date.now() + 5*365*24*3600*1000); // ~5 years

        await runTransaction(db, async (tx)=>{
          const uref = doc(db,"users",uid);
          const usnap = await tx.get(uref);
          const udata = usnap.exists() ? usnap.data() : {};

          if(fee > 0){
            const bal = Number(udata.mainWallet || 0);
            if(bal < fee) throw new Error("Insufficient balance in main wallet for this upload.");
            tx.set(uref, { mainWallet: bal - fee }, { merge:true });
          }

          // write pending
          const pRef = collection(db,"pendingAdverts");
          tx.set(doc(pRef), {
            uid,
            title,
            description: desc,
            sourceType: "direct",
            url,
            publicId: up.public_id || null,
            bytes: up.bytes || null,
            duration: up.duration || null,
            createdAt: serverTimestamp(),
            expiresAt,
            status: "pending",
            amountCharged: fee
          });
        });

        say("Advert submitted for review ✅ It will appear after approval.", true);
        // reset
        $("title").value=""; $("desc").value=""; fileInput.value="";
        preview.innerHTML = '<span class="note">No file selected</span>';
        pickedFile = null;
      }catch(err){
        console.error(err);
        say(err.message || "Upload failed.");
      }
    });
  </script>
</body>
</html>
